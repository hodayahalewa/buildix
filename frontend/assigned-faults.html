<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Assigned Faults</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="techName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-technician.html">
          <i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="assigned-faults.html">
          <i class="bi bi-exclamation-triangle"></i> <span id="nav-assignedFaults"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> <span id="nav-announcements"></span>
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted" id="pageSubtitle"></small>
      </div>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <select id="filterStatus" class="form-select" onchange="filterFaults()">
              <option value="" id="allStatuses"></option>
              <option value="in_progress" id="statusInProgress"></option>
              <option value="waiting_part" id="statusWaiting"></option>
              <option value="closed" id="statusClosed"></option>
            </select>
          </div>
          <div class="col-md-4">
            <select id="filterUrgency" class="form-select" onchange="filterFaults()">
              <option value="" id="allUrgencies"></option>
              <option value="low" id="urgencyLow"></option>
              <option value="medium" id="urgencyMedium"></option>
              <option value="high" id="urgencyHigh"></option>
            </select>
          </div>
          <div class="col-md-4">
            <button class="btn btn-outline-secondary w-100" onclick="resetFilters()" id="resetBtn"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Faults List -->
    <div id="faultsList" class="row g-4">
      <div class="col-12 text-center py-4 text-muted" id="loadingText"></div>
    </div>

  </div>

  <!-- Update Status Modal -->
  <div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="updateFaultId">

          <div class="mb-3">
            <label class="form-label fw-bold" id="statusLabel"></label>
            <select id="newStatus" class="form-select">
              <option value="in_progress" id="statusInProgressOpt"></option>
              <option value="waiting_part" id="statusWaitingOpt"></option>
              <option value="closed" id="statusClosedOpt"></option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" id="noteLabel"></label>
            <textarea id="note" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancelBtn"></button>
          <button type="button" class="btn btn-primary" onclick="updateStatus()" id="updateBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר ושהוא טכנאי
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'technician') {
      window.location.href = 'login.html';
    }

    document.getElementById('techName').textContent = user.full_name;
    let allFaults = [];

    // החלת תרגומים
    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-assignedFaults').textContent = t('assignedFaults');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('pageTitle').textContent = t('assignedFaults');
      document.getElementById('pageSubtitle').textContent = isHe ? 'נהל את התקלות המוקצות לך' : 'Manage your assigned faults';
      document.getElementById('allStatuses').textContent = isHe ? 'כל הסטטוסים' : 'All Statuses';
      document.getElementById('statusInProgress').textContent = t('in_progress');
      document.getElementById('statusWaiting').textContent = t('waiting_part');
      document.getElementById('statusClosed').textContent = t('closed');
      document.getElementById('allUrgencies').textContent = isHe ? 'כל הדחיפויות' : 'All Urgencies';
      document.getElementById('urgencyLow').textContent = t('low');
      document.getElementById('urgencyMedium').textContent = t('medium');
      document.getElementById('urgencyHigh').textContent = t('high');
      document.getElementById('resetBtn').innerHTML = `<i class="bi bi-arrow-counterclockwise"></i> ${t('reset')}`;
      document.getElementById('loadingText').textContent = t('loading');
      document.getElementById('modalTitle').textContent = isHe ? 'עדכון סטטוס תקלה' : 'Update Fault Status';
      document.getElementById('statusLabel').textContent = isHe ? 'סטטוס חדש' : 'New Status';
      document.getElementById('statusInProgressOpt').textContent = t('in_progress');
      document.getElementById('statusWaitingOpt').textContent = t('waiting_part');
      document.getElementById('statusClosedOpt').textContent = t('closed');
      document.getElementById('noteLabel').textContent = isHe ? 'הערה (אופציונלי)' : 'Note (optional)';
      document.getElementById('cancelBtn').textContent = t('cancel');
      document.getElementById('updateBtn').textContent = isHe ? 'עדכן' : 'Update';
    }

    // טעינת תקלות מוקצות
    async function loadAssignedFaults() {
      try {
        const response = await fetch('http://localhost:3000/api/faults/assigned', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        allFaults = data.faults;
        renderFaults(allFaults);

      } catch (err) {
        console.error('Error loading faults:', err);
      }
    }

    // הצגת תקלות כקלפים
    function renderFaults(faults) {
      const isHe = getLang() === 'he';
      const list = document.getElementById('faultsList');

      if (faults.length === 0) {
        list.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-check-circle text-success fs-1"></i>
            <h5 class="mt-3 text-muted">${isHe ? 'אין תקלות מוקצות' : 'No assigned faults'}</h5>
          </div>`;
        return;
      }

      list.innerHTML = faults.map(fault => `
        <div class="col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="fw-bold mb-0">#${fault.id} - ${fault.title}</h6>
              <span class="badge-${fault.status.replace('_', '-')}">${t(fault.status)}</span>
            </div>
            <div class="card-body">
              <p class="text-muted small mb-2">${fault.description || (isHe ? 'אין תיאור' : 'No description')}</p>
              <div class="d-flex gap-3 small text-muted">
                <span><i class="bi bi-tag"></i> ${fault.fault_type}</span>
                <span><i class="bi bi-layers"></i> ${t('floor')} ${fault.floor || 'N/A'}</span>
                <span><i class="bi bi-door-open"></i> ${fault.unit_number || 'N/A'}</span>
              </div>
              <div class="mt-2 small text-muted">
                <i class="bi bi-person"></i> ${isHe ? 'דווח על ידי' : 'Reported by'}: ${fault.reported_by_name || 'N/A'}
              </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between align-items-center">
              <span class="badge-${fault.urgency}">${t(fault.urgency)}</span>
              <button class="btn btn-sm btn-primary" onclick="openUpdateModal(${fault.id})">
                <i class="bi bi-pencil"></i> ${isHe ? 'עדכן סטטוס' : 'Update Status'}
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // פתיחת מודל עדכון סטטוס
    function openUpdateModal(faultId) {
      document.getElementById('updateFaultId').value = faultId;
      document.getElementById('note').value = '';
      new bootstrap.Modal(document.getElementById('updateModal')).show();
    }

    // עדכון סטטוס תקלה
    async function updateStatus() {
      const isHe = getLang() === 'he';
      const fault_id = document.getElementById('updateFaultId').value;
      const status = document.getElementById('newStatus').value;
      const note = document.getElementById('note').value;

      try {
        const response = await fetch('http://localhost:3000/api/faults/status', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ fault_id, status, note })
        });

        const data = await response.json();
        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('updateModal')).hide();
          loadAssignedFaults();
        } else {
          alert(data.message);
        }

      } catch (err) {
        alert(isHe ? 'שגיאה. אנא נסה שוב.' : 'Error. Please try again.');
      }
    }

    // סינון תקלות
    function filterFaults() {
      const status = document.getElementById('filterStatus').value;
      const urgency = document.getElementById('filterUrgency').value;

      const filtered = allFaults.filter(fault => {
        const matchStatus = !status || fault.status === status;
        const matchUrgency = !urgency || fault.urgency === urgency;
        return matchStatus && matchUrgency;
      });

      renderFaults(filtered);
    }

    // איפוס פילטרים
    function resetFilters() {
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterUrgency').value = '';
      renderFaults(allFaults);
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadAssignedFaults();
    });
  </script>

</body>
</html>
