<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Manage Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-manager.html">
          <i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="faults.html">
          <i class="bi bi-exclamation-triangle"></i> <span id="nav-faults"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="maintenance.html">
          <i class="bi bi-tools"></i> <span id="nav-maintenance"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="energy.html">
          <i class="bi bi-lightning"></i> <span id="nav-energy"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> <span id="nav-announcements"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="reports.html">
          <i class="bi bi-bar-chart"></i> <span id="nav-reports"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="users.html">
          <i class="bi bi-people"></i> <span id="nav-users"></span>
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted" id="pageSubtitle"></small>
      </div>
    </div>

    <!-- Pending Users -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white">
        <h6 class="fw-bold mb-0">
          <i class="bi bi-clock text-warning"></i>
          <span id="pendingTitle"></span>
          <span id="pendingCount" class="badge bg-warning text-dark ms-2">0</span>
        </h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th id="thName"></th>
                <th id="thEmail"></th>
                <th id="thPhone"></th>
                <th id="thRole"></th>
                <th id="thFloor"></th>
                <th id="thUnit"></th>
                <th id="thDate"></th>
                <th id="thActions"></th>
              </tr>
            </thead>
            <tbody id="pendingTable">
              <tr>
                <td colspan="9" class="text-center py-4 text-muted" id="loadingText"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    // החלת תרגומים
    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-faults').textContent = t('faults');
      document.getElementById('nav-maintenance').textContent = t('maintenance');
      document.getElementById('nav-energy').textContent = t('energy');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-reports').textContent = t('reports');
      document.getElementById('nav-users').textContent = t('users');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('pageTitle').textContent = isHe ? 'ניהול משתמשים' : 'Manage Users';
      document.getElementById('pageSubtitle').textContent = isHe ? 'אשר או דחה משתמשים חדשים' : 'Approve or reject new user registrations';
      document.getElementById('pendingTitle').textContent = t('pendingApprovals');
      document.getElementById('thName').textContent = t('fullName');
      document.getElementById('thEmail').textContent = t('emailAddress');
      document.getElementById('thPhone').textContent = t('phoneNumber');
      document.getElementById('thRole').textContent = t('role');
      document.getElementById('thFloor').textContent = t('floor');
      document.getElementById('thUnit').textContent = t('unitNumber');
      document.getElementById('thDate').textContent = t('date');
      document.getElementById('thActions').textContent = t('actions');
      document.getElementById('loadingText').textContent = t('loading');
    }

    // טעינת משתמשים ממתינים
    async function loadPendingUsers() {
      try {
        const response = await fetch('http://localhost:3000/api/auth/pending', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const users = data.users;
        document.getElementById('pendingCount').textContent = users.length;

        const tbody = document.getElementById('pendingTable');

        if (users.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-muted">${getLang() === 'he' ? 'אין משתמשים ממתינים' : 'No pending users'}</td></tr>`;
          return;
        }

        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.full_name}</td>
            <td>${u.email}</td>
            <td>${u.phone || 'N/A'}</td>
            <td><span class="badge bg-secondary">${t(u.role)}</span></td>
            <td>${u.floor || 'N/A'}</td>
            <td>${u.unit_number || 'N/A'}</td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-sm btn-success me-1" onclick="approveUser(${u.id}, true)">
                <i class="bi bi-check-lg"></i> ${t('approve')}
              </button>
              <button class="btn btn-sm btn-danger" onclick="approveUser(${u.id}, false)">
                <i class="bi bi-x-lg"></i> ${t('reject')}
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error loading pending users:', err);
      }
    }

    // אישור או דחיית משתמש
    async function approveUser(userId, approved) {
      const isHe = getLang() === 'he';
      const action = approved ? (isHe ? 'לאשר' : 'approve') : (isHe ? 'לדחות' : 'reject');
      if (!confirm(isHe ? `האם אתה בטוח שברצונך ${action} משתמש זה?` : `Are you sure you want to ${action} this user?`)) return;

      try {
        const response = await fetch('http://localhost:3000/api/auth/approve', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ user_id: userId, approved })
        });

        const data = await response.json();
        if (response.ok) {
          loadPendingUsers();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert(isHe ? 'שגיאה. אנא נסה שוב.' : 'Error. Please try again.');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadPendingUsers();
    });
  </script>

</body>
</html>
