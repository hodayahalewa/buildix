<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Manage Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
  <script src="js/alerts.js"></script>
</head>
<body>

  <div class="sidebar">
    <div class="text-center py-4">
      <img src="logo.png" height="80" alt="BUILDIX" class="mb-2">
      <h5 class="text-white fw-bold mb-0">BUILDIX</h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item"><a class="nav-link" href="dashboard-manager.html"><i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="faults.html"><i class="bi bi-exclamation-triangle"></i> <span id="nav-faults"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="maintenance.html"><i class="bi bi-tools"></i> <span id="nav-maintenance"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="energy.html"><i class="bi bi-lightning"></i> <span id="nav-energy"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="announcements.html"><i class="bi bi-megaphone"></i> <span id="nav-announcements"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="invoices.html"><i class="bi bi-receipt"></i> <span id="nav-invoices"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> <span id="nav-reports"></span></a></li>
      <li class="nav-item"><a class="nav-link active" href="users.html"><i class="bi bi-people"></i> <span id="nav-users"></span></a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span></a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted" id="pageSubtitle"></small>
      </div>
    </div>

    <!-- שורת סינון -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <!-- חיפוש -->
          <div class="col-md-4">
            <label class="form-label small fw-bold" id="searchLabel"></label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="searchInput" class="form-control" oninput="filterUsers()">
            </div>
          </div>
          <!-- סינון לפי תפקיד -->
          <div class="col-md-3">
            <label class="form-label small fw-bold" id="filterRoleLabel"></label>
            <select id="filterRole" class="form-select" onchange="filterUsers()">
              <option value="" id="allRoles"></option>
              <option value="tenant" id="roleTenant"></option>
              <option value="technician" id="roleTechnician"></option>
              <option value="manager" id="roleManager"></option>
            </select>
          </div>
          <!-- סינון לפי סטטוס אישור -->
          <div class="col-md-3">
            <label class="form-label small fw-bold" id="filterStatusLabel"></label>
            <select id="filterStatus" class="form-select" onchange="filterUsers()">
              <option value="" id="allStatuses"></option>
              <option value="approved" id="statusApproved"></option>
              <option value="pending" id="statusPending"></option>
              <option value="rejected" id="statusRejected"></option>
            </select>
          </div>
          <!-- כפתור איפוס -->
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" onclick="resetFilters()" id="resetBtn"></button>
          </div>
        </div>
      </div>
    </div>

    <!-- טבלת משתמשים -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0" id="usersTitle"></h6>
        <small class="text-muted" id="usersCount"></small>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th id="thName"></th>
                <th id="thEmail"></th>
                <th id="thPhone"></th>
                <th id="thRole"></th>
                <th id="thFloor"></th>
                <th id="thUnit"></th>
                <th id="thStatus"></th>
                <th id="thDate"></th>
                <th id="thActions"></th>
              </tr>
            </thead>
            <tbody id="usersTable">
              <tr><td colspan="10" class="text-center py-4 text-muted" id="loadingText"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- מודל שליחת הודעה למשתמש -->
  <div class="modal fade" id="messageModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border:none; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.2);">

        <div class="modal-header" style="background:#1a3a6b; border:none; padding:20px 24px; display:flex; align-items:center;">
          <h5 class="modal-title text-white fw-bold mb-0" id="messageModalTitle" style="font-size:1.05rem; flex:1;"></h5>
          <button type="button" class="modal-close-btn" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>

        <div class="modal-body" style="padding:24px;">
          <div id="messageError" class="alert alert-danger d-none"></div>
          <div id="messageSuccess" class="alert alert-success d-none"></div>
          <input type="hidden" id="messageUserId">
          <div class="mb-3">
            <label class="form-label fw-bold" id="messageToLabel"></label>
            <input type="text" id="messageTo" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="messageSubjectLabel"></label>
            <input type="text" id="messageSubject" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="messageBodyLabel"></label>
            <textarea id="messageBody" class="form-control" rows="5"></textarea>
          </div>
        </div>
        <div class="modal-footer" style="border:none; padding:16px 24px 24px;">
          <button type="button" class="btn" data-bs-dismiss="modal" id="messageCancelBtn"
            style="background:#f3f4f6; color:#374151; border-radius:10px; padding:9px 20px; font-size:0.88rem; font-weight:600;"></button>
          <button type="button" class="btn btn-primary" onclick="sendMessage()" id="messageSendBtn"
            style="border-radius:10px; padding:9px 20px; font-size:0.88rem; font-weight:600;"></button>
        </div>

      </div>
    </div>
  </div>

  <style>
    .modal-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      padding: 0;
    }
    .modal-close-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: rotate(90deg);
    }
    .modal-close-btn i { pointer-events: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    let allUsers = [];

    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-faults').textContent = t('faults');
      document.getElementById('nav-maintenance').textContent = t('maintenance');
      document.getElementById('nav-energy').textContent = t('energy');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-invoices').textContent = isHe ? 'חשבוניות' : 'Invoices';
      document.getElementById('nav-reports').textContent = t('reports');
      document.getElementById('nav-users').textContent = t('users');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('pageTitle').textContent = isHe ? 'ניהול משתמשים' : 'Manage Users';
      document.getElementById('pageSubtitle').textContent = isHe ? 'נהל את כל משתמשי המערכת' : 'Manage all system users';
      document.getElementById('searchLabel').textContent = isHe ? 'חיפוש' : 'Search';
      document.getElementById('searchInput').placeholder = isHe ? 'שם, מייל או טלפון...' : 'Name, email or phone...';
      document.getElementById('filterRoleLabel').textContent = isHe ? 'תפקיד' : 'Role';
      document.getElementById('allRoles').textContent = isHe ? 'כל התפקידים' : 'All Roles';
      document.getElementById('roleTenant').textContent = isHe ? 'דייר' : 'Tenant';
      document.getElementById('roleTechnician').textContent = isHe ? 'טכנאי' : 'Technician';
      document.getElementById('roleManager').textContent = isHe ? 'מנהל' : 'Manager';
      document.getElementById('filterStatusLabel').textContent = isHe ? 'סטטוס אישור' : 'Approval Status';
      document.getElementById('allStatuses').textContent = isHe ? 'כולם (ללא נדחים)' : 'All (excluding rejected)';
      document.getElementById('statusApproved').textContent = isHe ? '✅ מאושר' : '✅ Approved';
      document.getElementById('statusPending').textContent = isHe ? '⏳ ממתין' : '⏳ Pending';
      document.getElementById('statusRejected').textContent = isHe ? '❌ נדחה' : '❌ Rejected';
      document.getElementById('resetBtn').innerHTML = `<i class="bi bi-arrow-counterclockwise"></i> ${isHe ? 'איפוס' : 'Reset'}`;
      document.getElementById('usersTitle').innerHTML = `<i class="bi bi-people text-primary"></i> ${isHe ? 'כל המשתמשים' : 'All Users'}`;
      document.getElementById('thName').textContent = t('fullName');
      document.getElementById('thEmail').textContent = t('emailAddress');
      document.getElementById('thPhone').textContent = t('phoneNumber');
      document.getElementById('thRole').textContent = t('role');
      document.getElementById('thFloor').textContent = t('floor');
      document.getElementById('thUnit').textContent = t('unitNumber');
      document.getElementById('thStatus').textContent = isHe ? 'סטטוס' : 'Status';
      document.getElementById('thDate').textContent = t('date');
      document.getElementById('thActions').textContent = t('actions');
      document.getElementById('loadingText').textContent = t('loading');
      document.getElementById('messageModalTitle').textContent = isHe ? 'שליחת הודעה למשתמש' : 'Send Message to User';
      document.getElementById('messageToLabel').textContent = isHe ? 'אל' : 'To';
      document.getElementById('messageSubjectLabel').textContent = isHe ? 'נושא *' : 'Subject *';
      document.getElementById('messageBodyLabel').textContent = isHe ? 'תוכן ההודעה *' : 'Message *';
      document.getElementById('messageCancelBtn').textContent = t('cancel');
      document.getElementById('messageSendBtn').innerHTML = `<i class="bi bi-send"></i> ${isHe ? 'שלח' : 'Send'}`;
    }

    async function loadUsers() {
      try {
        const response = await fetch('http://localhost:3000/api/auth/all-users', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();

        allUsers = data.users.sort((a, b) => {
          if (a.is_approved === b.is_approved) {
            return new Date(b.created_at) - new Date(a.created_at);
          }
          return a.is_approved - b.is_approved;
        });

        filterUsers();
      } catch (err) {
        console.error('Error loading users:', err);
      }
    }

    function statusBadgeHtml(isApproved, isHe) {
      if (isApproved === 1) {
        return `<span class="badge bg-success">✅ ${isHe ? 'מאושר' : 'Approved'}</span>`;
      }
      if (isApproved === 2) {
        return `<span class="badge bg-danger">❌ ${isHe ? 'נדחה' : 'Rejected'}</span>`;
      }
      return `<span class="badge bg-warning text-dark">⏳ ${isHe ? 'ממתין' : 'Pending'}</span>`;
    }

    function renderUsers(users) {
      const isHe = getLang() === 'he';
      const tbody = document.getElementById('usersTable');

      document.getElementById('usersCount').textContent = isHe
        ? `${users.length} משתמשים`
        : `${users.length} users`;

      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-muted">${isHe ? 'לא נמצאו משתמשים' : 'No users found'}</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        let actionButtons = '';

        if (u.is_approved === 0) {
          actionButtons = `
            <button class="btn btn-sm btn-success" onclick="approveUser(${u.id}, 'approve')" title="${isHe ? 'אשר' : 'Approve'}">
              <i class="bi bi-check-lg"></i>
            </button>
            <button class="btn btn-sm btn-danger" onclick="approveUser(${u.id}, 'reject')" title="${isHe ? 'דחה' : 'Reject'}">
              <i class="bi bi-x-lg"></i>
            </button>`;
        } else if (u.is_approved === 1) {
          actionButtons = `
            <button class="btn btn-sm btn-outline-warning" onclick="approveUser(${u.id}, 'revoke')" title="${isHe ? 'בטל אישור' : 'Revoke'}">
              <i class="bi bi-slash-circle"></i>
            </button>
            <button class="btn btn-sm btn-info text-white" onclick="openMessageModal(${u.id}, '${u.full_name}', '${u.email}')" title="${isHe ? 'שלח הודעה' : 'Send message'}">
              <i class="bi bi-envelope"></i>
            </button>`;
        } else if (u.is_approved === 2) {
          actionButtons = `
            <button class="btn btn-sm btn-success" onclick="approveUser(${u.id}, 'approve')" title="${isHe ? 'אשר בכל זאת' : 'Approve anyway'}">
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
            <button class="btn btn-sm btn-info text-white" onclick="openMessageModal(${u.id}, '${u.full_name}', '${u.email}')" title="${isHe ? 'שלח הודעה' : 'Send message'}">
              <i class="bi bi-envelope"></i>
            </button>`;
        }

        return `
        <tr class="${u.is_approved === 0 ? 'table-warning' : ''} ${u.is_approved === 2 ? 'table-secondary' : ''}">
          <td>${u.id}</td>
          <td class="fw-bold">${u.full_name}</td>
          <td>${u.email}</td>
          <td>${u.phone || 'N/A'}</td>
          <td><span class="badge bg-secondary">${translateRole(u.role, isHe)}</span></td>
          <td>${u.floor || 'N/A'}</td>
          <td>${u.unit_number || 'N/A'}</td>
          <td>${statusBadgeHtml(u.is_approved, isHe)}</td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td>
            <div class="d-flex gap-1">
              ${actionButtons}
            </div>
          </td>
        </tr>
      `;
      }).join('');
    }

    function translateRole(role, isHe) {
      const map = {
        tenant: isHe ? 'דייר' : 'Tenant',
        technician: isHe ? 'טכנאי' : 'Technician',
        manager: isHe ? 'מנהל' : 'Manager'
      };
      return map[role] || role;
    }

    function filterUsers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const role = document.getElementById('filterRole').value;
      const status = document.getElementById('filterStatus').value;

      const filtered = allUsers.filter(u => {
        const matchSearch = !search ||
          u.full_name.toLowerCase().includes(search) ||
          u.email.toLowerCase().includes(search) ||
          (u.phone && u.phone.includes(search));
        const matchRole = !role || u.role === role;

        let matchStatus;
        if (status === '') {
          matchStatus = u.is_approved !== 2;
        } else if (status === 'approved') {
          matchStatus = u.is_approved === 1;
        } else if (status === 'pending') {
          matchStatus = u.is_approved === 0;
        } else if (status === 'rejected') {
          matchStatus = u.is_approved === 2;
        }

        return matchSearch && matchRole && matchStatus;
      });

      renderUsers(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterRole').value = '';
      document.getElementById('filterStatus').value = '';
      filterUsers();
    }

    async function approveUser(userId, action) {
      const isHe = getLang() === 'he';
      const actionText = {
        approve: isHe ? 'לאשר' : 'approve',
        reject: isHe ? 'לדחות' : 'reject',
        revoke: isHe ? 'לבטל את האישור של' : 'revoke access for'
      };

      if (!confirm(isHe
        ? `האם אתה בטוח שברצונך ${actionText[action]} משתמש זה?`
        : `Are you sure you want to ${actionText[action]} this user?`)) return;

      try {
        const response = await fetch('http://localhost:3000/api/auth/approve', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ user_id: userId, action })
        });
        const data = await response.json();
        if (response.ok) {
          await loadUsers();
          if (window.refreshAlerts) refreshAlerts();
        } else {
          alert(data.message);
          await loadUsers();
        }
      } catch (err) {
        alert(isHe ? 'שגיאה. אנא נסה שוב.' : 'Error. Please try again.');
      }
    }

    function openMessageModal(userId, userName, userEmail) {
      const isHe = getLang() === 'he';
      document.getElementById('messageUserId').value = userId;
      document.getElementById('messageTo').value = `${userName} (${userEmail})`;
      document.getElementById('messageSubject').value = '';
      document.getElementById('messageBody').value = '';
      document.getElementById('messageError').classList.add('d-none');
      document.getElementById('messageSuccess').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('messageModal')).show();
    }

    async function sendMessage() {
      const isHe = getLang() === 'he';
      const userId = document.getElementById('messageUserId').value;
      const subject = document.getElementById('messageSubject').value;
      const body = document.getElementById('messageBody').value;
      const messageError = document.getElementById('messageError');
      const messageSuccess = document.getElementById('messageSuccess');

      messageError.classList.add('d-none');
      messageSuccess.classList.add('d-none');

      if (!subject || !body) {
        messageError.textContent = isHe ? 'אנא מלא נושא ותוכן הודעה.' : 'Please fill in subject and message.';
        messageError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/auth/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ user_id: userId, subject, body })
        });
        const data = await response.json();
        if (response.ok) {
          messageSuccess.textContent = isHe ? '✅ ההודעה נשלחה בהצלחה!' : '✅ Message sent successfully!';
          messageSuccess.classList.remove('d-none');
          setTimeout(() => {
            bootstrap.Modal.getInstance(document.getElementById('messageModal')).hide();
          }, 1500);
        } else {
          messageError.textContent = data.message;
          messageError.classList.remove('d-none');
        }
      } catch (err) {
        messageError.textContent = isHe ? 'שגיאת חיבור.' : 'Connection error.';
        messageError.classList.remove('d-none');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadUsers();
    });
  </script>
</body>
</html>
