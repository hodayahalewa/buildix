<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Manage Users</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="managerName"></small>
    </div>

    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-manager.html">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="faults.html">
          <i class="bi bi-exclamation-triangle"></i> Faults
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="maintenance.html">
          <i class="bi bi-tools"></i> Maintenance
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="energy.html">
          <i class="bi bi-lightning"></i> Energy
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> Announcements
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="reports.html">
          <i class="bi bi-bar-chart"></i> Reports
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="users.html">
          <i class="bi bi-people"></i> Users
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0">Manage Users</h4>
        <small class="text-muted">Approve or reject new user registrations</small>
      </div>
    </div>

    <!-- Pending Users -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-header bg-white">
        <h6 class="fw-bold mb-0">
          <i class="bi bi-clock text-warning"></i> Pending Approvals
          <span id="pendingCount" class="badge bg-warning text-dark ms-2">0</span>
        </h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Floor</th>
                <th>Unit</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pendingTable">
              <tr>
                <td colspan="9" class="text-center py-4 text-muted">
                  Loading pending users...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר ושהוא מנהל
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    // הצגת שם המנהל
    document.getElementById('managerName').textContent = user.full_name;

    // טעינת המשתמשים הממתינים לאישור
    async function loadPendingUsers() {
      try {
        const response = await fetch('http://localhost:3000/api/auth/pending', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const users = data.users;

        // עדכון מספר הממתינים
        document.getElementById('pendingCount').textContent = users.length;

        const tbody = document.getElementById('pendingTable');

        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9" class="text-center py-4 text-muted">No pending users</td></tr>';
          return;
        }

        // הצגת המשתמשים הממתינים בטבלה
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${u.full_name}</td>
            <td>${u.email}</td>
            <td>${u.phone || 'N/A'}</td>
            <td><span class="badge bg-secondary">${u.role}</span></td>
            <td>${u.floor || 'N/A'}</td>
            <td>${u.unit_number || 'N/A'}</td>
            <td>${new Date(u.created_at).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-sm btn-success me-1" onclick="approveUser(${u.id}, true)">
                <i class="bi bi-check-lg"></i> Approve
              </button>
              <button class="btn btn-sm btn-danger" onclick="approveUser(${u.id}, false)">
                <i class="bi bi-x-lg"></i> Reject
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error loading pending users:', err);
      }
    }

    // אישור או דחיית משתמש
    async function approveUser(userId, approved) {
      const action = approved ? 'approve' : 'reject';
      if (!confirm(`Are you sure you want to ${action} this user?`)) return;

      try {
        const response = await fetch('http://localhost:3000/api/auth/approve', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ user_id: userId, approved })
        });

        const data = await response.json();

        if (response.ok) {
          alert(data.message);
          loadPendingUsers();
        } else {
          alert(data.message);
        }

      } catch (err) {
        alert('Error. Please try again.');
      }
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // טעינת הנתונים בעת פתיחת הדף
    loadPendingUsers();
  </script>

</body>
</html>
