<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Login</title>
  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- קובץ עיצוב מותאם אישית -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- תפריט עליון -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-building"></i> BUILDIX
      </a>
    </div>
  </nav>

  <!-- טופס התחברות -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <div class="card auth-card">
          <!-- כותרת הכרטיס -->
          <div class="card-header text-center">
            <h4 class="text-white fw-bold mb-0">
              <i class="bi bi-box-arrow-in-right"></i> Login
            </h4>
            <p class="text-white-50 mt-1 mb-0">Welcome back to BUILDIX</p>
          </div>

          <div class="card-body p-4">
            <!-- הודעת שגיאה -->
            <div id="errorMsg" class="alert alert-danger d-none"></div>
            <!-- הודעת הצלחה -->
            <div id="successMsg" class="alert alert-success d-none"></div>

            <!-- שדה מייל -->
            <div class="mb-3">
              <label class="form-label fw-500">Email Address</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" id="email" class="form-control" placeholder="Enter your email">
              </div>
            </div>

            <!-- שדה סיסמה -->
            <div class="mb-3">
              <label class="form-label fw-500">Password</label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" class="form-control" placeholder="Enter your password">
              </div>
            </div>

            <!-- כפתור התחברות -->
            <div class="d-grid mt-4">
              <button onclick="login()" class="btn btn-primary btn-lg">
                <i class="bi bi-box-arrow-in-right"></i> Login
              </button>
            </div>

            <!-- קישור להרשמה -->
            <div class="text-center mt-3">
              <p class="text-muted">
                Don't have an account?
                <a href="register.html" class="text-primary fw-bold">Register here</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // פונקציית התחברות - שולחת בקשה לשרת
    async function login() {
      // קריאת הערכים מהטופס
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      // איפוס הודעות קודמות
      errorMsg.classList.add('d-none');
      successMsg.classList.add('d-none');

      // בדיקה שהשדות מלאים
      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.classList.remove('d-none');
        return;
      }

      try {
        // שליחת בקשת התחברות לשרת
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // שמירת הטוקן ופרטי המשתמש בדפדפן
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          successMsg.textContent = 'Login successful! Redirecting...';
          successMsg.classList.remove('d-none');

          // הפניה לדשבורד המתאים לפי תפקיד
          setTimeout(() => {
            if (data.user.role === 'manager') {
              window.location.href = 'dashboard-manager.html';
            } else if (data.user.role === 'technician') {
              window.location.href = 'dashboard-technician.html';
            } else {
              window.location.href = 'dashboard-tenant.html';
            }
          }, 1000);

        } else {
          // הצגת הודעת שגיאה מהשרת
          errorMsg.textContent = data.message;
          errorMsg.classList.remove('d-none');
        }

      } catch (err) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.remove('d-none');
      }
    }

    // אפשרות להתחבר עם Enter
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });
  </script>

</body>
</html>
