<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body class="bg-light">

  <!-- תפריט עליון -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="logo.png" height="40" class="me-2" alt="BUILDIX"> BUILDIX
      </a>
    </div>
  </nav>

  <!-- טופס התחברות -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <div class="card auth-card">
          <div class="card-header text-center">
            <h4 class="text-white fw-bold mb-0">
              <i class="bi bi-box-arrow-in-right"></i>
              <span id="loginTitle"></span>
            </h4>
            <p class="text-white-50 mt-1 mb-0" id="loginSubtitle"></p>
          </div>

          <div class="card-body p-4">
            <div id="errorMsg" class="alert alert-danger d-none"></div>
            <div id="successMsg" class="alert alert-success d-none"></div>

            <!-- שדה מייל -->
            <div class="mb-3">
              <label class="form-label fw-bold" id="emailLabel"></label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" id="email" class="form-control">
              </div>
            </div>

            <!-- שדה סיסמה -->
            <div class="mb-3">
              <label class="form-label fw-bold" id="passwordLabel"></label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" class="form-control">
                <!-- כפתור הצגת/הסתרת סיסמה -->
                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" id="togglePwdBtn">
                  <i class="bi bi-eye" id="togglePwdIcon"></i>
                </button>
              </div>
            </div>

            <!-- זכור אותי -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label text-muted" for="rememberMe" id="rememberMeLabel"></label>
              </div>
            </div>

            <!-- כפתור התחברות -->
            <div class="d-grid">
              <button onclick="login()" class="btn btn-primary btn-lg" id="loginBtn"></button>
            </div>

            <!-- קישור להרשמה -->
            <div class="text-center mt-3">
              <p class="text-muted mb-0">
                <span id="noAccount"></span>
                <a href="register.html" class="text-primary fw-bold" id="registerLink"></a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // החלת תרגומים על הדף
    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('loginTitle').textContent = t('loginBtn');
      document.getElementById('loginSubtitle').textContent = t('welcomeBack');
      document.getElementById('emailLabel').textContent = t('emailAddress');
      document.getElementById('passwordLabel').textContent = t('password');
      document.getElementById('loginBtn').innerHTML = `<i class="bi bi-box-arrow-in-right"></i> ${t('loginBtn')}`;
      document.getElementById('noAccount').textContent = t('noAccount');
      document.getElementById('registerLink').textContent = t('registerHere');
      document.getElementById('rememberMeLabel').textContent = isHe ? 'זכור אותי' : 'Remember me';
      document.getElementById('email').placeholder = t('emailAddress');
      document.getElementById('password').placeholder = t('password');
    }

    // הצגת/הסתרת סיסמה
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('togglePwdIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    // טעינת פרטים שמורים מ-localStorage
    function loadSavedCredentials() {
      const saved = localStorage.getItem('rememberedEmail');
      if (saved) {
        document.getElementById('email').value = saved;
        document.getElementById('rememberMe').checked = true;
      }
    }

    // פונקציית התחברות
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');
      const isHe = getLang() === 'he';

      errorMsg.classList.add('d-none');
      successMsg.classList.add('d-none');

      if (!email || !password) {
        errorMsg.textContent = isHe ? 'אנא הזן מייל וסיסמה.' : 'Please enter email and password.';
        errorMsg.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // שמירת טוקן ומשתמש
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // זכירת מייל אם נבחר Remember Me
          if (rememberMe) {
            localStorage.setItem('rememberedEmail', email);
          } else {
            localStorage.removeItem('rememberedEmail');
          }

          successMsg.textContent = isHe ? '✅ התחברת בהצלחה! מעביר...' : '✅ Login successful! Redirecting...';
          successMsg.classList.remove('d-none');

          // ניווט לפי תפקיד
          setTimeout(() => {
            if (data.user.role === 'manager') {
              window.location.href = 'dashboard-manager.html';
            } else if (data.user.role === 'technician') {
              window.location.href = 'dashboard-technician.html';
            } else {
              window.location.href = 'dashboard-tenant.html';
            }
          }, 1000);

        } else {
          errorMsg.textContent = data.message;
          errorMsg.classList.remove('d-none');
        }

      } catch (err) {
        errorMsg.textContent = isHe ? 'שגיאת חיבור. אנא נסה שוב.' : 'Connection error. Please try again.';
        errorMsg.classList.remove('d-none');
      }
    }

    // התחברות עם Enter
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    // טעינת הדף
    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadSavedCredentials();
    });
  </script>

</body>
</html>
