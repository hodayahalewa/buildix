<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body class="bg-light">

  <!-- תפריט עליון -->
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-building"></i> BUILDIX
      </a>
    </div>
  </nav>

  <!-- טופס התחברות -->
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <div class="card auth-card">
          <div class="card-header text-center">
            <h4 class="text-white fw-bold mb-0">
              <i class="bi bi-box-arrow-in-right"></i>
              <span id="loginTitle"></span>
            </h4>
            <p class="text-white-50 mt-1 mb-0" id="loginSubtitle"></p>
          </div>

          <div class="card-body p-4">
            <div id="errorMsg" class="alert alert-danger d-none"></div>
            <div id="successMsg" class="alert alert-success d-none"></div>

            <!-- שדה מייל -->
            <div class="mb-3">
              <label class="form-label fw-bold" id="emailLabel"></label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-envelope"></i>
                </span>
                <input type="email" id="email" class="form-control" id="emailInput">
              </div>
            </div>

            <!-- שדה סיסמה -->
            <div class="mb-3">
              <label class="form-label fw-bold" id="passwordLabel"></label>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" id="password" class="form-control">
              </div>
            </div>

            <!-- כפתור התחברות -->
            <div class="d-grid mt-4">
              <button onclick="login()" class="btn btn-primary btn-lg" id="loginBtn"></button>
            </div>

            <!-- קישור להרשמה -->
            <div class="text-center mt-3">
              <p class="text-muted">
                <span id="noAccount"></span>
                <a href="register.html" class="text-primary fw-bold" id="registerLink"></a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // החלת תרגומים על הדף
    function applyTranslations() {
      document.getElementById('loginTitle').textContent = t('loginBtn');
      document.getElementById('loginSubtitle').textContent = t('welcomeBack');
      document.getElementById('emailLabel').textContent = t('emailAddress');
      document.getElementById('passwordLabel').textContent = t('password');
      document.getElementById('loginBtn').innerHTML = `<i class="bi bi-box-arrow-in-right"></i> ${t('loginBtn')}`;
      document.getElementById('noAccount').textContent = t('noAccount');
      document.getElementById('registerLink').textContent = t('registerHere');

      // placeholder
      document.getElementById('email').placeholder = t('emailAddress');
      document.getElementById('password').placeholder = t('password');
    }

    // פונקציית התחברות
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      errorMsg.classList.add('d-none');
      successMsg.classList.add('d-none');

      if (!email || !password) {
        errorMsg.textContent = t('error') + ': ' + t('emailAddress') + ' & ' + t('password');
        errorMsg.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          successMsg.textContent = t('success') + '! Redirecting...';
          successMsg.classList.remove('d-none');

          setTimeout(() => {
            if (data.user.role === 'manager') {
              window.location.href = 'dashboard-manager.html';
            } else if (data.user.role === 'technician') {
              window.location.href = 'dashboard-technician.html';
            } else {
              window.location.href = 'dashboard-tenant.html';
            }
          }, 1000);

        } else {
          errorMsg.textContent = data.message;
          errorMsg.classList.remove('d-none');
        }

      } catch (err) {
        errorMsg.textContent = t('error') + ': Connection failed.';
        errorMsg.classList.remove('d-none');
      }
    }

    // אפשרות להתחבר עם Enter
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login();
    });

    // החלת תרגומים בטעינת הדף
    document.addEventListener('DOMContentLoaded', applyTranslations);
  </script>

</body>
</html>
