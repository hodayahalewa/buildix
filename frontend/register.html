<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body class="bg-light">

  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="logo.png" height="40" class="me-2" alt="BUILDIX"> BUILDIX
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card auth-card">
          <div class="card-header text-center">
            <h4 class="text-white fw-bold mb-0">
              <i class="bi bi-person-plus"></i>
              <span id="createAccountTitle"></span>
            </h4>
            <p class="text-white-50 mt-1 mb-0" id="joinSubtitle"></p>
          </div>

          <div class="card-body p-4">
            <div id="errorMsg" class="alert alert-danger d-none"></div>
            <div id="successMsg" class="alert alert-success d-none"></div>

            <div class="mb-3">
              <label class="form-label fw-bold" id="fullNameLabel"></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" id="full_name" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" id="emailLabel"></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" id="phoneLabel"></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="tel" id="phone" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" id="passwordLabel"></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold" id="roleLabel"></label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                <select id="role" class="form-select" onchange="toggleFields()">
                  <option value="" id="selectRole"></option>
                  <option value="tenant" id="tenantOption"></option>
                  <option value="technician" id="technicianOption"></option>
                  <option value="manager" id="managerOption"></option>
                </select>
              </div>
            </div>

            <div id="tenantFields" class="d-none">
              <div class="mb-3">
                <label class="form-label fw-bold" id="floorLabel"></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-layers"></i></span>
                  <input type="text" id="floor" class="form-control" placeholder="e.g. 3">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold" id="unitLabel"></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-door-open"></i></span>
                  <input type="text" id="unit_number" class="form-control" placeholder="e.g. 12">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold" id="ownerPhoneLabel"></label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone-fill"></i></span>
                  <input type="tel" id="owner_phone" class="form-control">
                </div>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button onclick="register()" class="btn btn-primary btn-lg" id="createBtn"></button>
            </div>

            <div class="text-center mt-3">
              <p class="text-muted">
                <span id="alreadyAccount"></span>
                <a href="login.html" class="text-primary fw-bold" id="loginLink"></a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // החלת תרגומים
    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('createAccountTitle').textContent = t('createAccount');
      document.getElementById('joinSubtitle').textContent = isHe ? 'הצטרף ל-BUILDIX היום' : 'Join BUILDIX today';
      document.getElementById('fullNameLabel').textContent = t('fullName');
      document.getElementById('emailLabel').textContent = t('emailAddress');
      document.getElementById('phoneLabel').textContent = t('phoneNumber');
      document.getElementById('passwordLabel').textContent = t('password');
      document.getElementById('roleLabel').textContent = t('role');
      document.getElementById('selectRole').textContent = isHe ? 'בחר תפקיד' : 'Select your role';
      document.getElementById('tenantOption').textContent = t('tenant');
      document.getElementById('technicianOption').textContent = t('technician');
      document.getElementById('managerOption').textContent = t('manager');
      document.getElementById('floorLabel').textContent = t('floor');
      document.getElementById('unitLabel').textContent = t('unitNumber');
      document.getElementById('ownerPhoneLabel').textContent = t('ownerPhone');
      document.getElementById('createBtn').innerHTML = `<i class="bi bi-person-check"></i> ${t('createAccount')}`;
      document.getElementById('alreadyAccount').textContent = t('alreadyAccount');
      document.getElementById('loginLink').textContent = t('loginHere');
      document.getElementById('full_name').placeholder = t('fullName');
      document.getElementById('email').placeholder = t('emailAddress');
      document.getElementById('phone').placeholder = t('phoneNumber');
      document.getElementById('password').placeholder = t('password');
      document.getElementById('owner_phone').placeholder = t('ownerPhone');
    }

    function toggleFields() {
      const role = document.getElementById('role').value;
      const tenantFields = document.getElementById('tenantFields');
      if (role === 'tenant') {
        tenantFields.classList.remove('d-none');
      } else {
        tenantFields.classList.add('d-none');
      }
    }

    async function register() {
      const isHe = getLang() === 'he';
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      const full_name = document.getElementById('full_name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      const floor = document.getElementById('floor')?.value;
      const unit_number = document.getElementById('unit_number')?.value;
      const owner_phone = document.getElementById('owner_phone')?.value;

      errorMsg.classList.add('d-none');
      successMsg.classList.add('d-none');

      if (!full_name || !email || !phone || !password || !role) {
        errorMsg.textContent = isHe ? 'אנא מלא את כל השדות הנדרשים.' : 'Please fill in all required fields.';
        errorMsg.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ full_name, email, phone, password, role, floor, unit_number, owner_phone })
        });

        const data = await response.json();

        if (response.ok) {
          successMsg.textContent = isHe ? 'החשבון נוצר בהצלחה! אנא המתן לאישור המנהל.' : 'Account created successfully! Please wait for manager approval.';
          successMsg.classList.remove('d-none');
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
          errorMsg.textContent = data.message;
          errorMsg.classList.remove('d-none');
        }

      } catch (err) {
        errorMsg.textContent = isHe ? 'שגיאת חיבור. אנא נסה שוב.' : 'Connection error. Please try again.';
        errorMsg.classList.remove('d-none');
      }
    }

    document.addEventListener('DOMContentLoaded', applyTranslations);
  </script>

</body>
</html>
