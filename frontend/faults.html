<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Manage Faults</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-manager.html">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="faults.html">
          <i class="bi bi-exclamation-triangle"></i> Faults
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="maintenance.html">
          <i class="bi bi-tools"></i> Maintenance
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="energy.html">
          <i class="bi bi-lightning"></i> Energy
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> Announcements
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="reports.html">
          <i class="bi bi-bar-chart"></i> Reports
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="users.html">
          <i class="bi bi-people"></i> Users
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0">Manage Faults</h4>
        <small class="text-muted">View and manage all building faults</small>
      </div>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <select id="filterStatus" class="form-select" onchange="filterFaults()">
              <option value="">All Statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="waiting_part">Waiting Part</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="col-md-3">
            <select id="filterUrgency" class="form-select" onchange="filterFaults()">
              <option value="">All Urgencies</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Search faults..." oninput="filterFaults()">
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" onclick="resetFilters()">
              <i class="bi bi-arrow-counterclockwise"></i> Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Faults Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Type</th>
                <th>Reported By</th>
                <th>Floor</th>
                <th>Urgency</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="faultsTable">
              <tr>
                <td colspan="10" class="text-center py-4 text-muted">
                  Loading faults...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Assign Fault Modal -->
  <div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-person-check"></i> Assign Fault
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="assignFaultId">
          <div class="mb-3">
            <label class="form-label fw-bold">Select Technician</label>
            <select id="technicianSelect" class="form-select">
              <option value="">Loading technicians...</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="assignFault()">
            <i class="bi bi-check-lg"></i> Assign
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר ושהוא מנהל
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    // משתנה לשמירת כל התקלות
    let allFaults = [];

    // טעינת כל התקלות מהשרת
    async function loadFaults() {
      try {
        const response = await fetch('http://localhost:3000/api/faults/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        allFaults = data.faults;
        renderFaults(allFaults);

      } catch (err) {
        console.error('Error loading faults:', err);
      }
    }

    // הצגת התקלות בטבלה
    function renderFaults(faults) {
      const tbody = document.getElementById('faultsTable');

      if (faults.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">No faults found</td></tr>';
        return;
      }

      tbody.innerHTML = faults.map(fault => `
        <tr>
          <td>${fault.id}</td>
          <td>${fault.title}</td>
          <td>${fault.fault_type}</td>
          <td>${fault.reported_by_name || 'N/A'}</td>
          <td>${fault.floor || 'N/A'}</td>
          <td><span class="badge-${fault.urgency}">${fault.urgency}</span></td>
          <td><span class="badge-${fault.status.replace('_', '-')}">${fault.status.replace('_', ' ')}</span></td>
          <td>${fault.assigned_to_name || 'Unassigned'}</td>
          <td>${new Date(fault.created_at).toLocaleDateString()}</td>
          <td>
            <button class="btn btn-sm btn-primary me-1" onclick="openAssignModal(${fault.id})">
              <i class="bi bi-person-check"></i>
            </button>
            <button class="btn btn-sm btn-warning" onclick="updateStatus(${fault.id})">
              <i class="bi bi-pencil"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // סינון תקלות לפי פילטרים
    function filterFaults() {
      const status = document.getElementById('filterStatus').value;
      const urgency = document.getElementById('filterUrgency').value;
      const search = document.getElementById('searchInput').value.toLowerCase();

      const filtered = allFaults.filter(fault => {
        const matchStatus = !status || fault.status === status;
        const matchUrgency = !urgency || fault.urgency === urgency;
        const matchSearch = !search ||
          fault.title.toLowerCase().includes(search) ||
          (fault.reported_by_name && fault.reported_by_name.toLowerCase().includes(search));
        return matchStatus && matchUrgency && matchSearch;
      });

      renderFaults(filtered);
    }

    // איפוס פילטרים
    function resetFilters() {
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterUrgency').value = '';
      document.getElementById('searchInput').value = '';
      renderFaults(allFaults);
    }

    // פתיחת מודל שיוך תקלה לטכנאי
    async function openAssignModal(faultId) {
      document.getElementById('assignFaultId').value = faultId;

      // טעינת רשימת הטכנאים
      try {
        const response = await fetch('http://localhost:3000/api/auth/technicians', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const select = document.getElementById('technicianSelect');

        select.innerHTML = data.technicians.map(t =>
          `<option value="${t.id}">${t.full_name}</option>`
        ).join('');

      } catch (err) {
        console.error('Error loading technicians:', err);
      }

      new bootstrap.Modal(document.getElementById('assignModal')).show();
    }

    // שיוך תקלה לטכנאי
    async function assignFault() {
      const fault_id = document.getElementById('assignFaultId').value;
      const technician_id = document.getElementById('technicianSelect').value;

      try {
        const response = await fetch('http://localhost:3000/api/faults/assign', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ fault_id, technician_id })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Fault assigned successfully!');
          bootstrap.Modal.getInstance(document.getElementById('assignModal')).hide();
          loadFaults();
        } else {
          alert(data.message);
        }

      } catch (err) {
        alert('Error assigning fault. Please try again.');
      }
    }

    // עדכון סטטוס תקלה
    async function updateStatus(faultId) {
      const status = prompt('Enter new status:\n- open\n- in_progress\n- waiting_part\n- closed');
      if (!status) return;

      const note = prompt('Add a note (optional):');

      try {
        const response = await fetch('http://localhost:3000/api/faults/status', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ fault_id: faultId, status, note })
        });

        const data = await response.json();
        if (response.ok) {
          alert('Status updated successfully!');
          loadFaults();
        } else {
          alert(data.message);
        }

      } catch (err) {
        alert('Error updating status. Please try again.');
      }
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // טעינת הנתונים בעת פתיחת הדף
    loadFaults();
  </script>

</body>
</html>
