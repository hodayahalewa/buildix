<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Manage Faults</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
  <script src="js/alerts.js"></script>
  <style>
    .tech-item { padding: 10px 15px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f0f0f0; }
    .tech-item:last-child { border-bottom: none; }
    .tech-item:hover { background: #f0f4ff; color: #1a3a6b; }
    .tech-item.selected { background: #e8f0fe; color: #1a3a6b; font-weight: 600; }
    .fault-image { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 2px solid #dee2e6; transition: transform 0.2s; }
    .fault-image:hover { transform: scale(1.1); }
    .img-lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .img-lightbox img { max-width: 90%; max-height: 90%; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="text-center py-4">
      <img src="logo.png" height="80" alt="BUILDIX" class="mb-2">
      <h5 class="text-white fw-bold mb-0">BUILDIX</h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item"><a class="nav-link" href="dashboard-manager.html"><i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span></a></li>
      <li class="nav-item"><a class="nav-link active" href="faults.html"><i class="bi bi-exclamation-triangle"></i> <span id="nav-faults"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="maintenance.html"><i class="bi bi-tools"></i> <span id="nav-maintenance"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="energy.html"><i class="bi bi-lightning"></i> <span id="nav-energy"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="announcements.html"><i class="bi bi-megaphone"></i> <span id="nav-announcements"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="invoices.html"><i class="bi bi-receipt"></i> <span id="nav-invoices"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> <span id="nav-reports"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="users.html"><i class="bi bi-people"></i> <span id="nav-users"></span></a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span></a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted" id="pageSubtitle"></small>
      </div>
    </div>

    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label small fw-bold" id="searchLabel"></label>
            <input type="text" id="searchInput" class="form-control" oninput="filterFaults()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold" id="dateFromLabel"></label>
            <input type="date" id="filterDateFrom" class="form-control" onchange="filterFaults()">
          </div>
          <div class="col-md-2">
            <label class="form-label small fw-bold" id="dateToLabel"></label>
            <input type="date" id="filterDateTo" class="form-control" onchange="filterFaults()">
          </div>
          <div class="col-md-2">
            <button class="btn btn-outline-secondary w-100" onclick="resetFilters()" id="resetBtn"></button>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th id="thTitle"></th>
                <th>
                  <div id="thType"></div>
                  <select id="filterType" class="form-select form-select-sm mt-1" onchange="filterFaults()">
                    <option value="" id="allTypes"></option>
                    <option value="plumbing" id="typePlumbing"></option>
                    <option value="electrical" id="typeElectrical"></option>
                    <option value="elevator" id="typeElevator"></option>
                    <option value="cleaning" id="typeCleaning"></option>
                    <option value="security" id="typeSecurity"></option>
                    <option value="ac" id="typeAC"></option>
                    <option value="structural" id="typeStructural"></option>
                    <option value="other" id="typeOther"></option>
                  </select>
                </th>
                <th>
                  <div id="thReportedBy"></div>
                  <input type="text" id="filterReportedBy" class="form-control form-control-sm mt-1" oninput="filterFaults()">
                </th>
                <th id="thFloor"></th>
                <th>
                  <div id="thUrgency"></div>
                  <select id="filterUrgency" class="form-select form-select-sm mt-1" onchange="filterFaults()">
                    <option value="" id="allUrgencies"></option>
                    <option value="low" id="urgencyLow"></option>
                    <option value="medium" id="urgencyMedium"></option>
                    <option value="high" id="urgencyHigh"></option>
                  </select>
                </th>
                <th>
                  <div id="thStatus"></div>
                  <select id="filterStatus" class="form-select form-select-sm mt-1" onchange="filterFaults()">
                    <option value="" id="allStatuses"></option>
                    <option value="open" id="statusOpen"></option>
                    <option value="in_progress" id="statusInProgress"></option>
                    <option value="waiting_part" id="statusWaiting"></option>
                    <option value="closed" id="statusClosed"></option>
                  </select>
                </th>
                <th id="thAssigned"></th>
                <th style="cursor:pointer" onclick="toggleDateSort()">
                  <span id="thCreatedAt"></span> <i id="createdSortIcon" class="bi bi-arrow-down-up"></i>
                </th>
                <th id="thUpdatedAt"></th>
                <th id="thActions"></th>
              </tr>
            </thead>
            <tbody id="faultsTable">
              <tr><td colspan="11" class="text-center py-4 text-muted" id="loadingText"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- מודל פרטי תקלה -->
  <div class="modal fade" id="faultDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailsTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailsBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="closeDetailsBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- מודל שיוך טכנאי -->
  <div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="assignModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="assignFaultId">
          <div id="alreadyAssignedMsg" class="alert alert-warning d-none mb-3">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="alreadyAssignedText"></span>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="selectTechLabel"></label>
            <input type="text" id="techSearch" class="form-control mb-2" oninput="filterTechList()" autocomplete="off">
            <div id="techList" style="max-height:200px; overflow-y:auto; border:1px solid #dee2e6; border-radius:8px;"></div>
            <input type="hidden" id="selectedTechId">
            <small class="text-success fw-bold mt-1" id="selectedTechName"></small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancelBtn"></button>
          <button type="button" class="btn btn-primary" onclick="assignFault()" id="assignBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <!-- מודל עדכון סטטוס -->
  <div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="statusModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="statusFaultId">
          <div class="mb-3">
            <label class="form-label fw-bold" id="newStatusLabel"></label>
            <div class="d-flex flex-wrap gap-2 mt-2">
              <button type="button" class="btn btn-outline-warning status-btn" data-status="open" onclick="selectStatus('open')">
                <i class="bi bi-circle"></i> <span id="statusOpenBtn"></span>
              </button>
              <button type="button" class="btn btn-outline-primary status-btn" data-status="in_progress" onclick="selectStatus('in_progress')">
                <i class="bi bi-gear"></i> <span id="statusProgressBtn"></span>
              </button>
              <button type="button" class="btn btn-outline-secondary status-btn" data-status="waiting_part" onclick="selectStatus('waiting_part')">
                <i class="bi bi-clock"></i> <span id="statusWaitingBtn"></span>
              </button>
              <button type="button" class="btn btn-outline-success status-btn" data-status="closed" onclick="selectStatus('closed')">
                <i class="bi bi-check-circle"></i> <span id="statusClosedBtn"></span>
              </button>
            </div>
            <input type="hidden" id="selectedStatus">
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="noteLabel"></label>
            <textarea id="statusNote" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="statusCancelBtn"></button>
          <button type="button" class="btn btn-primary" onclick="saveStatus()" id="statusSaveBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <div id="lightbox" class="img-lightbox d-none" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));
    if (!token || !user || user.role !== 'manager') window.location.href = 'login.html';
    document.getElementById('managerName').textContent = user.full_name;

    let allFaults = [];
    let allTechnicians = [];
    let dateSortAsc = true;

    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-faults').textContent = t('faults');
      document.getElementById('nav-maintenance').textContent = t('maintenance');
      document.getElementById('nav-energy').textContent = t('energy');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-invoices').textContent = isHe ? 'חשבוניות' : 'Invoices';
      document.getElementById('nav-reports').textContent = t('reports');
      document.getElementById('nav-users').textContent = t('users');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('pageTitle').textContent = isHe ? 'ניהול תקלות' : 'Manage Faults';
      document.getElementById('pageSubtitle').textContent = isHe ? 'צפה ונהל את כל תקלות הבניין' : 'View and manage all building faults';
      document.getElementById('searchLabel').textContent = isHe ? 'חיפוש חופשי' : 'Free Search';
      document.getElementById('searchInput').placeholder = isHe ? 'חפש לפי כותרת או מדווח...' : 'Search by title or reporter...';
      document.getElementById('dateFromLabel').textContent = isHe ? 'מתאריך יצירה' : 'Created From';
      document.getElementById('dateToLabel').textContent = isHe ? 'עד תאריך יצירה' : 'Created To';
      document.getElementById('resetBtn').innerHTML = `<i class="bi bi-arrow-counterclockwise"></i> ${t('reset')}`;
      document.getElementById('thTitle').textContent = t('title');
      document.getElementById('thType').textContent = t('type');
      document.getElementById('thReportedBy').textContent = t('reportedBy');
      document.getElementById('filterReportedBy').placeholder = isHe ? 'סנן...' : 'Filter...';
      document.getElementById('thFloor').textContent = t('floor');
      document.getElementById('thUrgency').textContent = t('urgency');
      document.getElementById('thStatus').textContent = t('status');
      document.getElementById('thAssigned').textContent = t('assignedTo');
      document.getElementById('thCreatedAt').textContent = isHe ? 'תאריך יצירה' : 'Created At';
      document.getElementById('thUpdatedAt').textContent = isHe ? 'עדכון אחרון' : 'Last Update';
      document.getElementById('thActions').textContent = t('actions');
      document.getElementById('loadingText').textContent = t('loading');
      document.getElementById('allTypes').textContent = isHe ? 'כל הסוגים' : 'All Types';
      document.getElementById('typePlumbing').textContent = isHe ? 'אינסטלציה' : 'Plumbing';
      document.getElementById('typeElectrical').textContent = isHe ? 'חשמל' : 'Electrical';
      document.getElementById('typeElevator').textContent = isHe ? 'מעלית' : 'Elevator';
      document.getElementById('typeCleaning').textContent = isHe ? 'ניקיון' : 'Cleaning';
      document.getElementById('typeSecurity').textContent = isHe ? 'אבטחה' : 'Security';
      document.getElementById('typeAC').textContent = isHe ? 'מיזוג' : 'AC';
      document.getElementById('typeStructural').textContent = isHe ? 'מבני' : 'Structural';
      document.getElementById('typeOther').textContent = isHe ? 'אחר' : 'Other';
      document.getElementById('allStatuses').textContent = isHe ? 'כל הסטטוסים' : 'All Statuses';
      document.getElementById('statusOpen').textContent = t('open');
      document.getElementById('statusInProgress').textContent = t('in_progress');
      document.getElementById('statusWaiting').textContent = t('waiting_part');
      document.getElementById('statusClosed').textContent = t('closed');
      document.getElementById('allUrgencies').textContent = isHe ? 'כל הדחיפויות' : 'All Urgencies';
      document.getElementById('urgencyLow').textContent = t('low');
      document.getElementById('urgencyMedium').textContent = t('medium');
      document.getElementById('urgencyHigh').textContent = t('high');
      document.getElementById('assignModalTitle').textContent = isHe ? 'שייך תקלה לטכנאי' : 'Assign Fault';
      document.getElementById('selectTechLabel').textContent = isHe ? 'בחר טכנאי' : 'Select Technician';
      document.getElementById('techSearch').placeholder = isHe ? 'חפש טכנאי...' : 'Search technician...';
      document.getElementById('cancelBtn').textContent = t('cancel');
      document.getElementById('assignBtn').textContent = isHe ? 'שייך' : 'Assign';
      document.getElementById('statusModalTitle').textContent = isHe ? 'עדכון סטטוס תקלה' : 'Update Fault Status';
      document.getElementById('newStatusLabel').textContent = isHe ? 'בחר סטטוס חדש' : 'Select New Status';
      document.getElementById('statusOpenBtn').textContent = t('open');
      document.getElementById('statusProgressBtn').textContent = t('in_progress');
      document.getElementById('statusWaitingBtn').textContent = t('waiting_part');
      document.getElementById('statusClosedBtn').textContent = t('closed');
      document.getElementById('noteLabel').textContent = isHe ? 'הערה (אופציונלי)' : 'Note (optional)';
      document.getElementById('statusNote').placeholder = isHe ? 'הוסף הערה...' : 'Add a note...';
      document.getElementById('statusCancelBtn').textContent = t('cancel');
      document.getElementById('statusSaveBtn').innerHTML = `<i class="bi bi-check-lg"></i> ${isHe ? 'שמור' : 'Save'}`;
      document.getElementById('closeDetailsBtn').textContent = t('cancel');
    }

    async function loadFaults() {
      try {
        const response = await fetch('http://localhost:3000/api/faults/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        allFaults = data.faults.sort((a, b) => a.id - b.id);
        filterFaults(); // מציג ללא סגורות כברירת מחדל
      } catch (err) {
        console.error('Error loading faults:', err);
      }
    }

    async function loadTechnicians() {
      try {
        const response = await fetch('http://localhost:3000/api/auth/technicians', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        allTechnicians = data.technicians;
      } catch (err) {
        console.error('Error loading technicians:', err);
      }
    }

    function renderFaults(faults) {
      const isHe = getLang() === 'he';
      const tbody = document.getElementById('faultsTable');
      if (faults.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-center py-4 text-muted">${t('noFaults')}</td></tr>`;
        return;
      }
      tbody.innerHTML = faults.map(fault => {
        let imagesHtml = '';
        if (fault.images) {
          const imgs = typeof fault.images === 'string' ? JSON.parse(fault.images) : fault.images;
          if (imgs && imgs.length > 0) {
            imagesHtml = `<div class="d-flex gap-1 mt-1">
              ${imgs.map(url => `<img src="http://localhost:3000${url}" class="fault-image" onclick="openLightbox('http://localhost:3000${url}')">`).join('')}
            </div>`;
          }
        }
        return `
          <tr>
            <td>${fault.id}</td>
            <td><div>${fault.title}</div>${imagesHtml}</td>
            <td>${fault.fault_type}</td>
            <td>${fault.reported_by_name || 'N/A'}</td>
            <td>${fault.floor || 'N/A'}</td>
            <td><span class="badge-${fault.urgency}">${t(fault.urgency)}</span></td>
            <td><span class="badge-${fault.status.replace('_','-')}">${t(fault.status)}</span></td>
            <td>${fault.assigned_to_name || (isHe ? 'לא מוקצה' : 'Unassigned')}</td>
            <td>${new Date(fault.created_at).toLocaleDateString()}</td>
            <td>${fault.updated_at ? new Date(fault.updated_at).toLocaleDateString() : '-'}</td>
            <td>
              <div class="d-flex gap-1 align-items-center">
                <button class="btn btn-sm btn-outline-primary" onclick="openDetails(${fault.id})" title="${isHe ? 'פרטים' : 'Details'}"><i class="bi bi-eye"></i></button>
                <button class="btn btn-sm btn-primary" onclick="openAssignModal(${fault.id}, '${(fault.assigned_to_name || '').replace(/'/g, "\\'")}')" title="${isHe ? 'שייך' : 'Assign'}"><i class="bi bi-person-check"></i></button>
                <button class="btn btn-sm btn-warning" onclick="openStatusModal(${fault.id}, '${fault.status}')" title="${isHe ? 'עדכן סטטוס' : 'Update Status'}"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-sm btn-danger" onclick="deleteFault(${fault.id})" title="${isHe ? 'מחק' : 'Delete'}"><i class="bi bi-trash"></i></button>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    async function openDetails(faultId) {
      const isHe = getLang() === 'he';
      const fault = allFaults.find(f => f.id === faultId);
      if (!fault) return;
      let imagesHtml = '';
      if (fault.images) {
        const imgs = typeof fault.images === 'string' ? JSON.parse(fault.images) : fault.images;
        if (imgs && imgs.length > 0) {
          imagesHtml = `<div class="mb-3"><strong>${isHe ? 'תמונות:' : 'Photos:'}</strong><div class="d-flex gap-2 flex-wrap mt-2">
            ${imgs.map(url => `<img src="http://localhost:3000${url}" style="width:120px;height:120px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid #dee2e6;" onclick="openLightbox('http://localhost:3000${url}')" alt="">`).join('')}
          </div></div>`;
        }
      }
      let historyHtml = '';
      try {
        const res = await fetch(`http://localhost:3000/api/faults/updates/${faultId}`, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();
        if (data.updates && data.updates.length > 0) {
          const sc = { open:'#f59e0b', in_progress:'#3b82f6', waiting_part:'#8b5cf6', closed:'#10b981' };
          historyHtml = `<div class="mb-3"><strong>${isHe ? 'היסטוריית עדכונים:' : 'Update History:'}</strong><div class="mt-2" style="max-height:200px;overflow-y:auto;">
            ${data.updates.map(u => `<div class="d-flex gap-2 mb-2">
              <div style="width:10px;height:10px;border-radius:50%;background:${sc[u.status]||'#1a3a6b'};margin-top:5px;flex-shrink:0;"></div>
              <div style="background:#f9fafb;border-radius:8px;padding:8px 12px;flex:1;font-size:0.82rem;">
                <div class="d-flex justify-content-between">
                  <strong style="color:${sc[u.status]||'#1a3a6b'}">${t(u.status)}</strong>
                  <span class="badge bg-light text-dark" style="font-size:0.7rem;">${u.updated_by_name||'N/A'}</span>
                </div>
                ${u.note ? `<div class="mt-1">${u.note}</div>` : ''}
                <div style="font-size:0.72rem;color:#9ca3af;margin-top:3px;">${new Date(u.created_at).toLocaleDateString('he-IL')} ${new Date(u.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
              </div>
            </div>`).join('')}
          </div></div>`;
        }
      } catch(err) {}
      document.getElementById('detailsTitle').textContent = `#${fault.id} - ${fault.title}`;
      document.getElementById('detailsBody').innerHTML = `
        <div class="row g-3 mb-3">
          <div class="col-md-6"><table class="table table-sm">
            <tr><td class="text-muted">${isHe?'סטטוס:':'Status:'}</td><td><span class="badge-${fault.status.replace('_','-')}">${t(fault.status)}</span></td></tr>
            <tr><td class="text-muted">${isHe?'דחיפות:':'Urgency:'}</td><td><span class="badge-${fault.urgency}">${t(fault.urgency)}</span></td></tr>
            <tr><td class="text-muted">${isHe?'סוג:':'Type:'}</td><td>${fault.fault_type}</td></tr>
            <tr><td class="text-muted">${isHe?'קומה:':'Floor:'}</td><td>${fault.floor||'N/A'}</td></tr>
            <tr><td class="text-muted">${isHe?'יחידה:':'Unit:'}</td><td>${fault.unit_number||'N/A'}</td></tr>
            <tr><td class="text-muted">${isHe?'מדווח:':'Reporter:'}</td><td>${fault.reported_by_name||'N/A'}</td></tr>
            <tr><td class="text-muted">${isHe?'טכנאי:':'Technician:'}</td><td>${fault.assigned_to_name||(isHe?'לא מוקצה':'Unassigned')}</td></tr>
            <tr><td class="text-muted">${isHe?'תאריך:':'Date:'}</td><td>${new Date(fault.created_at).toLocaleDateString('he-IL')}</td></tr>
          </table></div>
          <div class="col-md-6"><strong>${isHe?'תיאור:':'Description:'}</strong><p class="text-muted small mt-1">${fault.description||(isHe?'אין תיאור':'No description')}</p></div>
        </div>${imagesHtml}${historyHtml}`;
      new bootstrap.Modal(document.getElementById('faultDetailsModal')).show();
    }

    async function deleteFault(faultId) {
      const isHe = getLang() === 'he';
      if (!confirm(isHe ? '⚠️ האם אתה בטוח שברצונך למחוק תקלה זו?' : '⚠️ Are you sure you want to delete this fault?')) return;
      try {
        const response = await fetch(`http://localhost:3000/api/faults/delete/${faultId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
        const data = await response.json();
        if (response.ok) { loadFaults(); }
        else { alert(data.message); }
      } catch(err) { alert(isHe ? 'שגיאה במחיקה.' : 'Error deleting fault.'); }
    }

    function openLightbox(url) { document.getElementById('lightboxImg').src = url; document.getElementById('lightbox').classList.remove('d-none'); }
    function closeLightbox() { document.getElementById('lightbox').classList.add('d-none'); }

    // סינון - ברירת מחדל: הסתר סגורות
    function filterFaults() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const urgency = document.getElementById('filterUrgency').value;
      const type = document.getElementById('filterType').value;
      const reportedBy = document.getElementById('filterReportedBy').value.toLowerCase();
      const dateFrom = document.getElementById('filterDateFrom').value;
      const dateTo = document.getElementById('filterDateTo').value;

      const filtered = allFaults.filter(fault => {
        const matchSearch = !search || fault.title.toLowerCase().includes(search) || (fault.reported_by_name && fault.reported_by_name.toLowerCase().includes(search));
        // ברירת מחדל: הסתר סגורות — אלא אם נבחר במפורש "סגור"
        const matchStatus = status === '' ? fault.status !== 'closed' : fault.status === status;
        const matchUrgency = !urgency || fault.urgency === urgency;
        const matchType = !type || fault.fault_type === type;
        const matchReportedBy = !reportedBy || (fault.reported_by_name && fault.reported_by_name.toLowerCase().includes(reportedBy));
        const faultDate = new Date(fault.created_at);
        const matchDateFrom = !dateFrom || faultDate >= new Date(dateFrom);
        const matchDateTo = !dateTo || faultDate <= new Date(dateTo + 'T23:59:59');
        return matchSearch && matchStatus && matchUrgency && matchType && matchReportedBy && matchDateFrom && matchDateTo;
      });
      renderFaults(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterUrgency').value = '';
      document.getElementById('filterType').value = '';
      document.getElementById('filterReportedBy').value = '';
      document.getElementById('filterDateFrom').value = '';
      document.getElementById('filterDateTo').value = '';
      filterFaults();
    }

    function toggleDateSort() {
      dateSortAsc = !dateSortAsc;
      document.getElementById('createdSortIcon').className = dateSortAsc ? 'bi bi-arrow-up' : 'bi bi-arrow-down';
      const sorted = [...allFaults].sort((a, b) => dateSortAsc ? new Date(a.created_at) - new Date(b.created_at) : new Date(b.created_at) - new Date(a.created_at));
      renderFaults(sorted);
    }

    function openAssignModal(faultId, assignedTo) {
      const isHe = getLang() === 'he';
      document.getElementById('assignFaultId').value = faultId;
      document.getElementById('techSearch').value = '';
      document.getElementById('selectedTechId').value = '';
      document.getElementById('selectedTechName').textContent = '';
      const alreadyMsg = document.getElementById('alreadyAssignedMsg');
      if (assignedTo && assignedTo !== '') {
        alreadyMsg.classList.remove('d-none');
        document.getElementById('alreadyAssignedText').textContent = isHe ? `⚠️ תקלה זו כבר מוקצת לטכנאי: ${assignedTo}` : `⚠️ This fault is already assigned to: ${assignedTo}`;
      } else { alreadyMsg.classList.add('d-none'); }
      renderTechList(allTechnicians);
      new bootstrap.Modal(document.getElementById('assignModal')).show();
    }

    function renderTechList(technicians) {
      const isHe = getLang() === 'he';
      const list = document.getElementById('techList');
      if (technicians.length === 0) { list.innerHTML = `<div class="p-3 text-muted text-center">${isHe ? 'לא נמצאו טכנאים' : 'No technicians found'}</div>`; return; }
      list.innerHTML = technicians.map(tech => `
        <div class="tech-item ${document.getElementById('selectedTechId').value == tech.id ? 'selected' : ''}" onclick="selectTechnician(${tech.id}, '${tech.full_name}')">
          <i class="bi bi-person-fill text-primary me-2"></i>${tech.full_name}<small class="text-muted ms-2">${tech.phone||''}</small>
        </div>`).join('');
    }

    function filterTechList() {
      const query = document.getElementById('techSearch').value.toLowerCase();
      renderTechList(allTechnicians.filter(t => t.full_name.toLowerCase().includes(query)));
    }

    function selectTechnician(id, name) {
      const isHe = getLang() === 'he';
      document.getElementById('selectedTechId').value = id;
      document.getElementById('selectedTechName').textContent = isHe ? `✓ נבחר: ${name}` : `✓ Selected: ${name}`;
      renderTechList(allTechnicians);
    }

    async function assignFault() {
      const isHe = getLang() === 'he';
      const fault_id = document.getElementById('assignFaultId').value;
      const technician_id = document.getElementById('selectedTechId').value;
      if (!technician_id) { alert(isHe ? 'אנא בחר טכנאי מהרשימה.' : 'Please select a technician from the list.'); return; }
      try {
        const response = await fetch('http://localhost:3000/api/faults/assign', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ fault_id, technician_id }) });
        const data = await response.json();
        if (response.ok) { bootstrap.Modal.getInstance(document.getElementById('assignModal')).hide(); loadFaults(); if (window.refreshAlerts) refreshAlerts(); }
        else { alert(data.message); }
      } catch(err) { alert(isHe ? 'שגיאה. אנא נסה שוב.' : 'Error. Please try again.'); }
    }

    function openStatusModal(faultId, currentStatus) {
      document.getElementById('statusFaultId').value = faultId;
      document.getElementById('selectedStatus').value = '';
      document.getElementById('statusNote').value = '';
      document.querySelectorAll('.status-btn').forEach(btn => {
        const color = getStatusColor(btn.dataset.status);
        if (btn.dataset.status === currentStatus) { btn.classList.remove(`btn-outline-${color}`); btn.classList.add(`btn-${color}`); }
        else { btn.classList.remove(`btn-${color}`); btn.classList.add(`btn-outline-${color}`); }
      });
      new bootstrap.Modal(document.getElementById('statusModal')).show();
    }

    function getStatusColor(status) {
      return { open:'warning', in_progress:'primary', waiting_part:'secondary', closed:'success' }[status] || 'secondary';
    }

    function selectStatus(status) {
      document.getElementById('selectedStatus').value = status;
      document.querySelectorAll('.status-btn').forEach(btn => {
        const color = getStatusColor(btn.dataset.status);
        if (btn.dataset.status === status) { btn.classList.remove(`btn-outline-${color}`); btn.classList.add(`btn-${color}`); }
        else { btn.classList.remove(`btn-${color}`); btn.classList.add(`btn-outline-${color}`); }
      });
    }

    async function saveStatus() {
      const isHe = getLang() === 'he';
      const fault_id = document.getElementById('statusFaultId').value;
      const status = document.getElementById('selectedStatus').value;
      const note = document.getElementById('statusNote').value;
      if (!status) { alert(isHe ? 'אנא בחר סטטוס.' : 'Please select a status.'); return; }
      if (status === 'closed') { if (!confirm(isHe ? '⚠️ האם וידאת שהתקלה אכן טופלה ונסגרה?' : '⚠️ Have you verified that the fault has been resolved?')) return; }
      try {
        const response = await fetch('http://localhost:3000/api/faults/status', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify({ fault_id, status, note }) });
        const data = await response.json();
        if (response.ok) { bootstrap.Modal.getInstance(document.getElementById('statusModal')).hide(); loadFaults(); }
        else { alert(data.message); }
      } catch(err) { alert(isHe ? 'שגיאה. אנא נסה שוב.' : 'Error. Please try again.'); }
    }

    function logout() { localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href = 'login.html'; }

    document.addEventListener('DOMContentLoaded', () => { applyTranslations(); loadFaults(); loadTechnicians(); });
  </script>
</body>
</html>
