<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Tenant Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
  <script src="js/alerts.js"></script>
</head>
<body>

  <div class="sidebar">
    <div class="text-center py-4">
      <img src="logo.png" height="80" alt="BUILDIX" class="mb-2">
      <h5 class="text-white fw-bold mb-0">BUILDIX</h5>
      <small class="text-secondary" id="tenantName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link active" href="dashboard-tenant.html">
          <i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="report-fault.html">
          <i class="bi bi-plus-circle"></i> <span id="nav-reportFault"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="my-faults.html">
          <i class="bi bi-exclamation-triangle"></i> <span id="nav-myFaults"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> <span id="nav-announcements"></span>
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span>
        </a>
      </li>
    </ul>
  </div>

  <div class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted"><span id="welcomeText"></span>, <span id="welcomeName"></span></small>
      </div>
      <div>
        <span class="badge bg-info" id="roleBadge"></span>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card stat-card bg-primary text-white">
          <div class="stat-number" id="totalFaults">0</div>
          <div class="stat-label text-white-50" id="statTotal"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card bg-warning text-white">
          <div class="stat-number" id="openFaults">0</div>
          <div class="stat-label text-white-50" id="statOpen"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card bg-success text-white">
          <div class="stat-number" id="closedFaults">0</div>
          <div class="stat-label text-white-50" id="statClosed"></div>
        </div>
      </div>
    </div>

    <!-- כפתור דיווח תקלה -->
    <div class="mb-4">
      <a href="report-fault.html" class="btn btn-primary btn-lg" id="reportBtn"></a>
    </div>

    <!-- טבלת תקלות -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0">
          <i class="bi bi-exclamation-triangle text-warning"></i>
          <span id="myFaultsTitle"></span>
        </h6>
        <a href="my-faults.html" class="btn btn-sm btn-primary" id="viewAllBtn"></a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th id="thTitle"></th>
                <th id="thType"></th>
                <th id="thUrgency"></th>
                <th id="thStatus"></th>
                <th id="thDate"></th>
              </tr>
            </thead>
            <tbody id="faultsTable">
              <tr>
                <td colspan="6" class="text-center py-4 text-muted" id="loadingText"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'tenant') {
      window.location.href = 'login.html';
    }

    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('tenantName').textContent = user.full_name;
      document.getElementById('welcomeName').textContent = user.full_name;
      document.getElementById('pageTitle').textContent = t('dashboard');
      document.getElementById('welcomeText').textContent = t('welcome');
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-reportFault').textContent = t('reportFault');
      document.getElementById('nav-myFaults').textContent = t('myFaults');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('statTotal').textContent = t('totalFaults');
      document.getElementById('statOpen').textContent = t('openFaults');
      document.getElementById('statClosed').textContent = t('closedFaults');
      document.getElementById('reportBtn').innerHTML = `<i class="bi bi-plus-circle"></i> ${t('reportNewFault')}`;
      document.getElementById('myFaultsTitle').textContent = t('myFaults');
      document.getElementById('viewAllBtn').textContent = t('viewAll');
      document.getElementById('thTitle').textContent = t('title');
      document.getElementById('thType').textContent = t('type');
      document.getElementById('thUrgency').textContent = t('urgency');
      document.getElementById('thStatus').textContent = t('status');
      document.getElementById('thDate').textContent = t('date');
      document.getElementById('loadingText').textContent = t('loading');
      document.getElementById('roleBadge').textContent = isHe ? 'דייר' : 'Tenant';
    }

    async function loadMyFaults() {
      try {
        const response = await fetch('http://localhost:3000/api/faults/my', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        // כולל את כל התקלות לסטטיסטיקות (גם סגורות)
        const faults = data.faults;

        document.getElementById('totalFaults').textContent = faults.length;
        document.getElementById('openFaults').textContent = faults.filter(f => f.status === 'open').length;
        document.getElementById('closedFaults').textContent = faults.filter(f => f.status === 'closed').length;

        const tbody = document.getElementById('faultsTable');
        if (faults.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">${t('noFaults')}</td></tr>`;
          return;
        }

        // הצג 5 תקלות ראשונות (ללא סגורות)
        const activeFaults = faults.filter(f => f.status !== 'closed');
        const displayFaults = activeFaults.length > 0 ? activeFaults.slice(0, 5) : faults.slice(0, 5);

        tbody.innerHTML = displayFaults.map(fault => `
          <tr>
            <td>${fault.id}</td>
            <td>${fault.title}</td>
            <td>${fault.fault_type}</td>
            <td><span class="badge-${fault.urgency}">${t(fault.urgency)}</span></td>
            <td><span class="badge-${fault.status.replace('_', '-')}">${t(fault.status)}</span></td>
            <td>${new Date(fault.created_at).toLocaleDateString()}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error loading faults:', err);
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadMyFaults();
    });
  </script>
</body>
</html>
