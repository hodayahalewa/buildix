<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Building Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="index.html">
        <img src="logo.png" height="40" class="me-2" alt="BUILDIX"> BUILDIX
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-light me-2" id="loginBtn"></a>
        <a href="register.html" class="btn btn-light" id="registerBtn"></a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section text-center py-5">
    <div class="container py-5">
      <h1 class="display-4 fw-bold text-primary mb-3">
        <i class="bi bi-building-fill"></i> BUILDIX
      </h1>
      <p class="lead text-muted mb-4" id="heroSubtitle"></p>
      <p class="text-muted mb-5" id="heroFeatures"></p>
      <a href="register.html" class="btn btn-primary btn-lg me-3" id="getStartedBtn"></a>
      <a href="login.html" class="btn btn-outline-primary btn-lg" id="loginLink"></a>
    </div>
  </section>

  <!-- Features Section -->
  <section class="py-5 bg-light">
    <div class="container">
      <h2 class="text-center fw-bold mb-5" id="whyTitle"></h2>
      <div class="row g-4">

        <div class="col-md-4">
          <div class="card h-100 border-0 shadow-sm text-center p-4">
            <i class="bi bi-lightning-fill text-primary fs-1 mb-3"></i>
            <h5 class="fw-bold" id="feature1Title"></h5>
            <p class="text-muted" id="feature1Desc"></p>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100 border-0 shadow-sm text-center p-4">
            <i class="bi bi-eye-fill text-primary fs-1 mb-3"></i>
            <h5 class="fw-bold" id="feature2Title"></h5>
            <p class="text-muted" id="feature2Desc"></p>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100 border-0 shadow-sm text-center p-4">
            <i class="bi bi-graph-up text-primary fs-1 mb-3"></i>
            <h5 class="fw-bold" id="feature3Title"></h5>
            <p class="text-muted" id="feature3Desc"></p>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-primary text-white text-center py-3">
    <p class="mb-0" id="footerText"></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // החלת תרגומים על דף הבית
    function applyTranslations() {
      const isHe = getLang() === 'he';

      document.getElementById('loginBtn').textContent = t('login');
      document.getElementById('registerBtn').textContent = t('register');
      document.getElementById('heroSubtitle').textContent = isHe ? 'מערכת חכמה לניהול ותחזוקת בניינים ומשרדים' : 'Smart Building & Facilities Management System';
      document.getElementById('heroFeatures').textContent = isHe ? 'דיווח תקלות בזמן אמת · מעקב שוטף · תחזוקה מונעת · דוחות חודשיים' : 'Real-time fault reporting · Live tracking · Preventive maintenance · Monthly reports';
      document.getElementById('getStartedBtn').innerHTML = `<i class="bi bi-person-plus"></i> ${isHe ? 'הצטרפו עכשיו' : 'Get Started'}`;
      document.getElementById('loginLink').innerHTML = `<i class="bi bi-box-arrow-in-right"></i> ${t('login')}`;
      document.getElementById('whyTitle').textContent = isHe ? 'למה BUILDIX?' : 'Why BUILDIX?';
      document.getElementById('feature1Title').textContent = isHe ? 'דיווח מהיר' : 'Fast Reporting';
      document.getElementById('feature1Desc').textContent = isHe ? 'דווח תקלה תוך שניות מכל מכשיר' : 'Report a fault in seconds from any device';
      document.getElementById('feature2Title').textContent = isHe ? 'שקיפות מלאה' : 'Full Transparency';
      document.getElementById('feature2Desc').textContent = isHe ? 'עקוב אחרי סטטוס התקלה בזמן אמת' : 'Track fault status in real time';
      document.getElementById('feature3Title').textContent = isHe ? 'חיסכון כספי' : 'Cost Savings';
      document.getElementById('feature3Desc').textContent = isHe ? 'חסוך עד 90,000 ₪ בשנה בהוצאות תחזוקה' : 'Save up to 90,000 ILS per year on maintenance';
      document.getElementById('footerText').textContent = isHe ? '© 2024 BUILDIX - כל הזכויות שמורות' : '© 2024 BUILDIX - All Rights Reserved';
    }

    document.addEventListener('DOMContentLoaded', applyTranslations);
  </script>

</body>
</html>
