<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Energy Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
  <script src="js/alerts.js"></script>
  <style>
    .modal-close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.1rem;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      padding: 0;
    }
    .modal-close-btn:hover {
      background: rgba(255,255,255,0.3);
      transform: rotate(90deg);
    }
    .modal-close-btn i { pointer-events: none; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="text-center py-4">
      <img src="logo.png" height="80" alt="BUILDIX" class="mb-2">
      <h5 class="text-white fw-bold mb-0">BUILDIX</h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item"><a class="nav-link" href="dashboard-manager.html"><i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="faults.html"><i class="bi bi-exclamation-triangle"></i> <span id="nav-faults"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="maintenance.html"><i class="bi bi-tools"></i> <span id="nav-maintenance"></span></a></li>
      <li class="nav-item"><a class="nav-link active" href="energy.html"><i class="bi bi-lightning"></i> <span id="nav-energy"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="announcements.html"><i class="bi bi-megaphone"></i> <span id="nav-announcements"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> <span id="nav-reports"></span></a></li>
      <li class="nav-item"><a class="nav-link" href="users.html"><i class="bi bi-people"></i> <span id="nav-users"></span></a></li>
      <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span></a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted" id="pageSubtitle"></small>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReadingModal" id="addBtn"></button>
    </div>

    <!-- כרטיסי מדידה אחרונה -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card stat-card bg-warning text-white">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="lastElectricity">-</div>
              <div class="stat-label text-white-50" id="electricityLabel"></div>
            </div>
            <i class="bi bi-lightning-fill fs-1 opacity-25"></i>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card stat-card bg-info text-white">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="lastWater">-</div>
              <div class="stat-label text-white-50" id="waterLabel"></div>
            </div>
            <i class="bi bi-droplet-fill fs-1 opacity-25"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- פריסה דו-טורית: גרפים משמאל, טבלה מימין -->
    <div class="row g-4">

      <!-- טור שמאל - גרפים -->
      <div class="col-lg-5">
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header bg-white">
            <h6 class="fw-bold mb-0" id="electricityChartTitle"></h6>
          </div>
          <div class="card-body">
            <canvas id="electricityChart"></canvas>
          </div>
        </div>
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white">
            <h6 class="fw-bold mb-0" id="waterChartTitle"></h6>
          </div>
          <div class="card-body">
            <canvas id="waterChart"></canvas>
          </div>
        </div>
      </div>

      <!-- טור ימין - סינון וטבלה -->
      <div class="col-lg-7">

        <!-- כרטיס סינון -->
        <div class="card border-0 shadow-sm mb-3">
          <div class="card-body">
            <div class="row g-2 align-items-end">
              <!-- סינון לפי סוג -->
              <div class="col-md-3">
                <label class="form-label small fw-bold" id="filterTypeLabel"></label>
                <select id="filterType" class="form-select form-select-sm" onchange="filterReadings()">
                  <option value="" id="allTypes"></option>
                  <option value="electricity" id="typeElectricity"></option>
                  <option value="water" id="typeWater"></option>
                </select>
              </div>
              <!-- סינון לפי חודש מ -->
              <div class="col-md-3">
                <label class="form-label small fw-bold" id="filterMonthFromLabel"></label>
                <input type="month" id="filterMonthFrom" class="form-control form-control-sm" onchange="filterReadings()" min="2020-01" max="2030-12">
              </div>
              <!-- סינון לפי חודש עד -->
              <div class="col-md-3">
                <label class="form-label small fw-bold" id="filterMonthToLabel"></label>
                <input type="month" id="filterMonthTo" class="form-control form-control-sm" onchange="filterReadings()" min="2020-01" max="2030-12">
              </div>
              <!-- כפתור איפוס -->
              <div class="col-md-3">
                <button class="btn btn-outline-secondary btn-sm w-100" onclick="resetFilters()">
                  <i class="bi bi-arrow-counterclockwise"></i> <span id="resetBtn"></span>
                </button>
              </div>
              <!-- סינון לפי כמות מינימום -->
              <div class="col-md-6">
                <label class="form-label small fw-bold" id="filterMinLabel"></label>
                <input type="number" id="filterMin" class="form-control form-control-sm" oninput="filterReadings()" min="0">
              </div>
              <!-- סינון לפי כמות מקסימום -->
              <div class="col-md-6">
                <label class="form-label small fw-bold" id="filterMaxLabel"></label>
                <input type="number" id="filterMax" class="form-control form-control-sm" oninput="filterReadings()" min="0">
              </div>
            </div>
          </div>
        </div>

        <!-- טבלת מדידות -->
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h6 class="fw-bold mb-0" id="allReadingsTitle"></h6>
            <small class="text-muted" id="readingsCount"></small>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive" style="max-height:450px; overflow-y:auto;">
              <table class="table table-hover mb-0">
                <thead class="table-light sticky-top">
                  <tr>
                    <th>#</th>
                    <th id="thType"></th>
                    <th id="thReading" style="cursor:pointer" onclick="sortByReading()">
                      <span id="thReadingText"></span> <i id="readingSortIcon" class="bi bi-arrow-down-up"></i>
                    </th>
                    <th id="thMonth" style="cursor:pointer" onclick="sortByMonth()">
                      <span id="thMonthText"></span> <i id="monthSortIcon" class="bi bi-arrow-down-up"></i>
                    </th>
                    <th id="thDate"></th>
                    <th id="thActions"></th>
                  </tr>
                </thead>
                <tbody id="energyTable">
                  <tr><td colspan="6" class="text-center py-4 text-muted" id="loadingText"></td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- מודל הוספת מדידה חדשה -->
  <div class="modal fade" id="addReadingModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border:none; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.2);">

        <div class="modal-header" style="background:#1a3a6b; border:none; padding:20px 24px; display:flex; align-items:center;">
          <h5 class="modal-title text-white fw-bold mb-0" id="modalTitle" style="font-size:1.05rem; flex:1;"></h5>
          <button type="button" class="modal-close-btn" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>

        <div class="modal-body">
          <div id="modalError" class="alert alert-danger d-none"></div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="typeLabel"></label>
            <select id="type" class="form-select" onchange="updateReadingLimits()">
              <option value="" id="selectType"></option>
              <option value="electricity" id="electricityOpt"></option>
              <option value="water" id="waterOpt"></option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="readingLabel"></label>
            <input type="number" id="reading" class="form-control" min="0" step="1">
            <small class="text-muted mt-1" id="readingHint"></small>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="monthLabel"></label>
            <input type="month" id="month" class="form-control" min="2020-01" max="2030-12">
          </div>
        </div>
        <div class="modal-footer" style="border:none; padding:16px 24px 24px;">
          <button type="button" class="btn" data-bs-dismiss="modal" id="cancelBtn"
            style="background:#f3f4f6; color:#374151; border-radius:10px; padding:9px 20px; font-size:0.88rem; font-weight:600;"></button>
          <button type="button" class="btn btn-primary" onclick="addReading()" id="addReadingBtn"
            style="border-radius:10px; padding:9px 20px; font-size:0.88rem; font-weight:600;"></button>
        </div>

      </div>
    </div>
  </div>

  <!-- מודל עריכת מדידה קיימת -->
  <div class="modal fade" id="editReadingModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content" style="border:none; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.2);">

        <div class="modal-header" style="background:#1a3a6b; border:none; padding:20px 24px; display:flex; align-items:center;">
          <h5 class="modal-title text-white fw-bold mb-0" id="editModalTitle" style="font-size:1.05rem; flex:1;"></h5>
          <button type="button" class="modal-close-btn" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>

        <div class="modal-body">
          <div id="editModalError" class="alert alert-danger d-none"></div>
          <input type="hidden" id="editReadingId">
          <div class="mb-3">
            <label class="form-label fw-bold" id="editTypeLabel"></label>
            <input type="text" id="editType" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="editMonthLabel"></label>
            <input type="text" id="editMonth" class="form-control" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold" id="editReadingLabel"></label>
            <input type="number" id="editReading" class="form-control" min="0" step="1">
            <small class="text-muted mt-1" id="editReadingHint"></small>
          </div>
        </div>
        <div class="modal-footer" style="border:none; padding:16px 24px 24px;">
          <button type="button" class="btn" data-bs-dismiss="modal" id="editCancelBtn"
            style="background:#f3f4f6; color:#374151; border-radius:10px; padding:9px 20px; font-size:0.88rem; font-weight:600;"></button>
          <button type="button" class="btn btn-primary" onclick="saveEdit()" id="editSaveBtn"
            style="border-radius:10px; padding:9px 20px; font-size:0.88rem; font-weight:600;"></button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // בדיקה שהמשתמש מחובר ושהוא מנהל
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    // משתנים גלובליים
    let allReadings = [];
    let electricityChartInstance = null;
    let waterChartInstance = null;
    let readingSortAsc = true;
    let monthSortAsc = true;
    let currentSort = null;

    // עדכון גבולות/רמזים לפי סוג המדידה שנבחר
    function updateReadingLimits() {
      const isHe = getLang() === 'he';
      const type = document.getElementById('type').value;
      const hint = document.getElementById('readingHint');
      const input = document.getElementById('reading');
      if (type === 'water') {
        input.max = 9999;
        hint.textContent = isHe ? 'טווח: 0 - 9,999 מ"ק' : 'Range: 0 - 9,999 m³';
      } else if (type === 'electricity') {
        input.max = 99999;
        hint.textContent = isHe ? 'טווח: 0 - 99,999 קוט"ש' : 'Range: 0 - 99,999 kWh';
      } else {
        input.max = '';
        hint.textContent = '';
      }
    }

    // מיון לפי עמודת קריאה
    function sortByReading() {
      readingSortAsc = currentSort === 'reading' ? !readingSortAsc : true;
      currentSort = 'reading';
      const sorted = [...allReadings].sort((a, b) => readingSortAsc ? a.reading - b.reading : b.reading - a.reading);
      document.getElementById('readingSortIcon').className = readingSortAsc ? 'bi bi-sort-numeric-down' : 'bi bi-sort-numeric-up';
      document.getElementById('monthSortIcon').className = 'bi bi-arrow-down-up';
      renderTable(sorted);
    }

    // מיון לפי עמודת חודש
    function sortByMonth() {
      monthSortAsc = currentSort === 'month' ? !monthSortAsc : true;
      currentSort = 'month';
      const sorted = [...allReadings].sort((a, b) => monthSortAsc ? a.month.localeCompare(b.month) : b.month.localeCompare(a.month));
      document.getElementById('monthSortIcon').className = monthSortAsc ? 'bi bi-sort-down' : 'bi bi-sort-up';
      document.getElementById('readingSortIcon').className = 'bi bi-arrow-down-up';
      renderTable(sorted);
    }

    // החלת תרגומים על כל אלמנטי הדף
    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-faults').textContent = t('faults');
      document.getElementById('nav-maintenance').textContent = t('maintenance');
      document.getElementById('nav-energy').textContent = t('energy');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-reports').textContent = t('reports');
      document.getElementById('nav-users').textContent = t('users');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('pageTitle').textContent = isHe ? 'ניהול אנרגיה' : 'Energy Management';
      document.getElementById('pageSubtitle').textContent = isHe ? 'עקוב אחרי צריכת חשמל ומים' : 'Track electricity and water consumption';
      document.getElementById('addBtn').innerHTML = `<i class="bi bi-plus-circle"></i> ${isHe ? 'הוסף מדידה' : 'Add Reading'}`;
      document.getElementById('electricityLabel').textContent = isHe ? 'מדידת חשמל אחרונה (קוט"ש)' : 'Last Electricity Reading (kWh)';
      document.getElementById('waterLabel').textContent = isHe ? 'מדידת מים אחרונה (מ"ק)' : 'Last Water Reading (m³)';
      document.getElementById('electricityChartTitle').textContent = isHe ? '⚡ צריכת חשמל' : '⚡ Electricity Consumption';
      document.getElementById('waterChartTitle').textContent = isHe ? '💧 צריכת מים' : '💧 Water Consumption';
      document.getElementById('filterTypeLabel').textContent = isHe ? 'סוג' : 'Type';
      document.getElementById('allTypes').textContent = isHe ? 'כל הסוגים' : 'All Types';
      document.getElementById('typeElectricity').textContent = isHe ? 'חשמל' : 'Electricity';
      document.getElementById('typeWater').textContent = isHe ? 'מים' : 'Water';
      document.getElementById('filterMonthFromLabel').textContent = isHe ? 'מחודש' : 'From Month';
      document.getElementById('filterMonthToLabel').textContent = isHe ? 'עד חודש' : 'To Month';
      document.getElementById('resetBtn').textContent = isHe ? 'איפוס' : 'Reset';
      document.getElementById('filterMinLabel').textContent = isHe ? 'כמות מינימום' : 'Min Amount';
      document.getElementById('filterMaxLabel').textContent = isHe ? 'כמות מקסימום' : 'Max Amount';
      document.getElementById('allReadingsTitle').innerHTML = `<i class="bi bi-table text-primary"></i> ${isHe ? 'כל המדידות' : 'All Readings'}`;
      document.getElementById('thType').textContent = isHe ? 'סוג' : 'Type';
      document.getElementById('thReadingText').textContent = isHe ? 'מדידה' : 'Reading';
      document.getElementById('thMonthText').textContent = isHe ? 'חודש' : 'Month';
      document.getElementById('thDate').textContent = isHe ? 'תאריך' : 'Date';
      document.getElementById('thActions').textContent = t('actions');
      document.getElementById('loadingText').textContent = t('loading');
      document.getElementById('modalTitle').textContent = isHe ? 'הוספת מדידה' : 'Add Reading';
      document.getElementById('typeLabel').textContent = isHe ? 'סוג *' : 'Type *';
      document.getElementById('selectType').textContent = isHe ? 'בחר סוג' : 'Select type';
      document.getElementById('electricityOpt').textContent = isHe ? 'חשמל' : 'Electricity';
      document.getElementById('waterOpt').textContent = isHe ? 'מים' : 'Water';
      document.getElementById('readingLabel').textContent = isHe ? 'מדידה *' : 'Reading *';
      document.getElementById('monthLabel').textContent = isHe ? 'חודש *' : 'Month *';
      document.getElementById('cancelBtn').textContent = t('cancel');
      document.getElementById('addReadingBtn').innerHTML = `<i class="bi bi-check-lg"></i> ${isHe ? 'הוסף' : 'Add'}`;
      document.getElementById('editModalTitle').textContent = isHe ? 'עריכת מדידה' : 'Edit Reading';
      document.getElementById('editTypeLabel').textContent = isHe ? 'סוג' : 'Type';
      document.getElementById('editMonthLabel').textContent = isHe ? 'חודש' : 'Month';
      document.getElementById('editReadingLabel').textContent = isHe ? 'מדידה חדשה *' : 'New Reading *';
      document.getElementById('editCancelBtn').textContent = t('cancel');
      document.getElementById('editSaveBtn').innerHTML = `<i class="bi bi-check-lg"></i> ${isHe ? 'שמור' : 'Save'}`;
    }

    // טעינת נתוני אנרגיה מהשרת
    async function loadEnergy() {
      try {
        const response = await fetch('http://localhost:3000/api/energy/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        allReadings = data.readings;

        const electricity = allReadings.filter(r => r.type === 'electricity').sort((a,b) => b.month.localeCompare(a.month));
        const water = allReadings.filter(r => r.type === 'water').sort((a,b) => b.month.localeCompare(a.month));

        document.getElementById('lastElectricity').textContent = electricity.length ? electricity[0].reading : '-';
        document.getElementById('lastWater').textContent = water.length ? water[0].reading : '-';

        buildChart('electricityChart', 'electricityChartInstance', electricity, getLang() === 'he' ? 'חשמל (קוט"ש)' : 'Electricity (kWh)', '#f59e0b');
        buildChart('waterChart', 'waterChartInstance', water, getLang() === 'he' ? 'מים (מ"ק)' : 'Water (m³)', '#0891b2');

        filterReadings();
      } catch (err) {
        console.error('Error loading energy:', err);
      }
    }

    // הצגת טבלת מדידות
    function renderTable(readings) {
      const isHe = getLang() === 'he';
      const tbody = document.getElementById('energyTable');
      document.getElementById('readingsCount').textContent = isHe ? `${readings.length} מדידות` : `${readings.length} readings`;

      if (readings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">${isHe ? 'לא נמצאו מדידות' : 'No readings found'}</td></tr>`;
        return;
      }

      tbody.innerHTML = readings.map(r => `
        <tr>
          <td>${r.id}</td>
          <td><span class="badge ${r.type === 'electricity' ? 'bg-warning text-dark' : 'bg-info text-white'}">${r.type === 'electricity' ? (isHe ? 'חשמל' : 'Electricity') : (isHe ? 'מים' : 'Water')}</span></td>
          <td>${parseFloat(r.reading).toFixed(2)}</td>
          <td>${r.month}</td>
          <td>${new Date(r.created_at).toLocaleDateString()}</td>
          <td class="d-flex gap-1">
            <button class="btn btn-sm btn-warning" onclick="openEditModal(${r.id}, '${r.type}', '${r.month}', ${r.reading})" title="${isHe ? 'ערוך' : 'Edit'}">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-danger" onclick="deleteReading(${r.id})" title="${isHe ? 'מחק' : 'Delete'}">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // סינון מדידות לפי כל הפילטרים
    function filterReadings() {
      const type = document.getElementById('filterType').value;
      const monthFrom = document.getElementById('filterMonthFrom').value;
      const monthTo = document.getElementById('filterMonthTo').value;
      const min = document.getElementById('filterMin').value;
      const max = document.getElementById('filterMax').value;

      const filtered = allReadings.filter(r => {
        const matchType = !type || r.type === type;
        const matchFrom = !monthFrom || r.month >= monthFrom;
        const matchTo = !monthTo || r.month <= monthTo;
        const matchMin = !min || r.reading >= parseFloat(min);
        const matchMax = !max || r.reading <= parseFloat(max);
        return matchType && matchFrom && matchTo && matchMin && matchMax;
      }).sort((a,b) => b.month.localeCompare(a.month));

      renderTable(filtered);
    }

    // איפוס פילטרים
    function resetFilters() {
      document.getElementById('filterType').value = '';
      document.getElementById('filterMonthFrom').value = '';
      document.getElementById('filterMonthTo').value = '';
      document.getElementById('filterMin').value = '';
      document.getElementById('filterMax').value = '';
      currentSort = null;
      document.getElementById('readingSortIcon').className = 'bi bi-arrow-down-up';
      document.getElementById('monthSortIcon').className = 'bi bi-arrow-down-up';
      filterReadings();
    }

    // בניית גרף קו לפי סוג מדידה
    function buildChart(canvasId, instanceVar, readings, label, color) {
      if (window[instanceVar]) window[instanceVar].destroy();
      const ctx = document.getElementById(canvasId);
      const sorted = [...readings].sort((a,b) => a.month.localeCompare(b.month));

      window[instanceVar] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sorted.map(r => r.month),
          datasets: [{
            label,
            data: sorted.map(r => r.reading),
            borderColor: color,
            backgroundColor: color + '20',
            tension: 0.4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    // הוספת מדידה חדשה עם בדיקת כפילות
    async function addReading() {
      const isHe = getLang() === 'he';
      const type = document.getElementById('type').value;
      const reading = document.getElementById('reading').value;
      const month = document.getElementById('month').value;
      const modalError = document.getElementById('modalError');

      modalError.classList.add('d-none');
      if (!type || !reading || !month) {
        modalError.textContent = isHe ? 'אנא מלא את כל השדות הנדרשים.' : 'Please fill in all required fields.';
        modalError.classList.remove('d-none');
        return;
      }

      const maxVal = type === 'water' ? 9999 : 99999;
      if (Number(reading) < 0 || Number(reading) > maxVal) {
        modalError.textContent = isHe
          ? `ערך לא תקין. הטווח המותר: 0 - ${maxVal.toLocaleString()}`
          : `Invalid value. Allowed range: 0 - ${maxVal.toLocaleString()}`;
        modalError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/energy/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ type, reading, month })
        });
        const data = await response.json();

        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('addReadingModal')).hide();
          loadEnergy();
          refreshAlerts();
        } else if (data.existing_id) {
          const typeText = type === 'electricity' ? (isHe ? 'חשמל' : 'electricity') : (isHe ? 'מים' : 'water');
          const confirmUpdate = confirm(
            isHe
              ? `כבר קיימת מדידה עבור ${typeText} בחודש ${month}.\nהאם ברצונך לעדכן אותה לערך ${reading}?`
              : `A reading for ${typeText} in ${month} already exists.\nDo you want to update it to ${reading}?`
          );
          if (confirmUpdate) await saveUpdatedReading(data.existing_id, reading);
        } else {
          modalError.textContent = data.message;
          modalError.classList.remove('d-none');
        }
      } catch (err) {
        modalError.textContent = isHe ? 'שגיאת חיבור.' : 'Connection error.';
        modalError.classList.remove('d-none');
      }
    }

    // פתיחת מודל עריכת מדידה קיימת
    function openEditModal(id, type, month, currentReading) {
      const isHe = getLang() === 'he';
      document.getElementById('editReadingId').value = id;
      document.getElementById('editType').value = type === 'electricity' ? (isHe ? 'חשמל' : 'Electricity') : (isHe ? 'מים' : 'Water');
      document.getElementById('editMonth').value = month;
      document.getElementById('editReading').value = currentReading;
      document.getElementById('editReading').max = type === 'water' ? 9999 : 99999;
      document.getElementById('editReadingHint').textContent = type === 'water'
        ? (isHe ? 'טווח: 0 - 9,999 מ"ק' : 'Range: 0 - 9,999 m³')
        : (isHe ? 'טווח: 0 - 99,999 קוט"ש' : 'Range: 0 - 99,999 kWh');
      document.getElementById('editModalError').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('editReadingModal')).show();
    }

    // שמירת עריכת מדידה
    async function saveEdit() {
      const isHe = getLang() === 'he';
      const id = document.getElementById('editReadingId').value;
      const reading = document.getElementById('editReading').value;
      const editModalError = document.getElementById('editModalError');

      editModalError.classList.add('d-none');
      if (!reading) {
        editModalError.textContent = isHe ? 'אנא הזן ערך מדידה.' : 'Please enter a reading value.';
        editModalError.classList.remove('d-none');
        return;
      }
      await saveUpdatedReading(id, reading);
    }

    // שליחת עדכון מדידה לשרת
    async function saveUpdatedReading(id, reading) {
      const isHe = getLang() === 'he';
      try {
        const response = await fetch('http://localhost:3000/api/energy/update', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ id, reading })
        });
        const data = await response.json();
        if (response.ok) {
          const addModal = bootstrap.Modal.getInstance(document.getElementById('addReadingModal'));
          const editModal = bootstrap.Modal.getInstance(document.getElementById('editReadingModal'));
          if (addModal) addModal.hide();
          if (editModal) editModal.hide();
          loadEnergy();
          refreshAlerts();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert(isHe ? 'שגיאת חיבור.' : 'Connection error.');
      }
    }

    // מחיקת מדידת אנרגיה
    async function deleteReading(id) {
      const isHe = getLang() === 'he';
      if (!confirm(isHe ? '⚠️ האם אתה בטוח שברצונך למחוק מדידה זו?' : '⚠️ Are you sure you want to delete this reading?')) return;

      try {
        const response = await fetch(`http://localhost:3000/api/energy/delete/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          loadEnergy();
          refreshAlerts();
        } else {
          const data = await response.json();
          alert(isHe ? `שגיאה: ${data.message}` : `Error: ${data.message}`);
        }
      } catch (err) {
        alert(isHe ? 'שגיאה.' : 'Error.');
      }
    }

    // ניקוי טופס הוספה בסגירת המודל
    document.getElementById('addReadingModal').addEventListener('hidden.bs.modal', () => {
      document.getElementById('type').value = '';
      document.getElementById('reading').value = '';
      document.getElementById('month').value = '';
      document.getElementById('readingHint').textContent = '';
      document.getElementById('modalError').classList.add('d-none');
    });

    // ניקוי טופס עריכה בסגירת המודל
    document.getElementById('editReadingModal').addEventListener('hidden.bs.modal', () => {
      document.getElementById('editReading').value = '';
      document.getElementById('editModalError').classList.add('d-none');
    });

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // טעינת הדף
    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadEnergy();
    });
  </script>
</body>
</html>
