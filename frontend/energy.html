<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Energy Management</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/translations.js"></script>
  <script src="js/lang-switcher.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-manager.html">
          <i class="bi bi-speedometer2"></i> <span id="nav-dashboard"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="faults.html">
          <i class="bi bi-exclamation-triangle"></i> <span id="nav-faults"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="maintenance.html">
          <i class="bi bi-tools"></i> <span id="nav-maintenance"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="energy.html">
          <i class="bi bi-lightning"></i> <span id="nav-energy"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> <span id="nav-announcements"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="reports.html">
          <i class="bi bi-bar-chart"></i> <span id="nav-reports"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="users.html">
          <i class="bi bi-people"></i> <span id="nav-users"></span>
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> <span id="nav-logout"></span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0" id="pageTitle"></h4>
        <small class="text-muted" id="pageSubtitle"></small>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addReadingModal" id="addBtn"></button>
    </div>

    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card stat-card bg-warning text-white">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="lastElectricity">-</div>
              <div class="stat-label text-white-50" id="electricityLabel"></div>
            </div>
            <i class="bi bi-lightning-fill fs-1 opacity-25"></i>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card stat-card bg-info text-white">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="stat-number" id="lastWater">-</div>
              <div class="stat-label text-white-50" id="waterLabel"></div>
            </div>
            <i class="bi bi-droplet-fill fs-1 opacity-25"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white">
            <h6 class="fw-bold mb-0" id="electricityChartTitle"></h6>
          </div>
          <div class="card-body">
            <canvas id="electricityChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white">
            <h6 class="fw-bold mb-0" id="waterChartTitle"></h6>
          </div>
          <div class="card-body">
            <canvas id="waterChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Readings Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white">
        <h6 class="fw-bold mb-0" id="allReadingsTitle"></h6>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th id="thType"></th>
                <th id="thReading"></th>
                <th id="thMonth"></th>
                <th id="thDate"></th>
              </tr>
            </thead>
            <tbody id="energyTable">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted" id="loadingText"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Add Reading Modal -->
  <div class="modal fade" id="addReadingModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalError" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label class="form-label fw-bold" id="typeLabel"></label>
            <select id="type" class="form-select">
              <option value="" id="selectType"></option>
              <option value="electricity" id="electricityOpt"></option>
              <option value="water" id="waterOpt"></option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" id="readingLabel"></label>
            <input type="number" id="reading" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" id="monthLabel"></label>
            <input type="month" id="month" class="form-control">
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="cancelBtn"></button>
          <button type="button" class="btn btn-primary" onclick="addReading()" id="addReadingBtn"></button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    // החלת תרגומים
    function applyTranslations() {
      const isHe = getLang() === 'he';
      document.getElementById('nav-dashboard').textContent = t('dashboard');
      document.getElementById('nav-faults').textContent = t('faults');
      document.getElementById('nav-maintenance').textContent = t('maintenance');
      document.getElementById('nav-energy').textContent = t('energy');
      document.getElementById('nav-announcements').textContent = t('announcements');
      document.getElementById('nav-reports').textContent = t('reports');
      document.getElementById('nav-users').textContent = t('users');
      document.getElementById('nav-logout').textContent = t('logout');
      document.getElementById('pageTitle').textContent = isHe ? 'ניהול אנרגיה' : 'Energy Management';
      document.getElementById('pageSubtitle').textContent = isHe ? 'עקוב אחרי צריכת חשמל ומים' : 'Track electricity and water consumption';
      document.getElementById('addBtn').innerHTML = `<i class="bi bi-plus-circle"></i> ${t('addReading')}`;
      document.getElementById('electricityLabel').textContent = t('lastElectricity');
      document.getElementById('waterLabel').textContent = t('lastWater');
      document.getElementById('electricityChartTitle').innerHTML = `<i class="bi bi-lightning text-warning"></i> ${isHe ? 'צריכת חשמל' : 'Electricity Consumption'}`;
      document.getElementById('waterChartTitle').innerHTML = `<i class="bi bi-droplet text-info"></i> ${isHe ? 'צריכת מים' : 'Water Consumption'}`;
      document.getElementById('allReadingsTitle').innerHTML = `<i class="bi bi-table"></i> ${isHe ? 'כל המדידות' : 'All Readings'}`;
      document.getElementById('thType').textContent = isHe ? 'סוג' : 'Type';
      document.getElementById('thReading').textContent = isHe ? 'מדידה' : 'Reading';
      document.getElementById('thMonth').textContent = t('month');
      document.getElementById('thDate').textContent = t('date');
      document.getElementById('loadingText').textContent = t('loading');
      document.getElementById('modalTitle').textContent = isHe ? 'הוסף מדידת אנרגיה' : 'Add Energy Reading';
      document.getElementById('typeLabel').textContent = isHe ? 'סוג *' : 'Type *';
      document.getElementById('selectType').textContent = isHe ? 'בחר סוג' : 'Select type';
      document.getElementById('electricityOpt').textContent = t('electricity');
      document.getElementById('waterOpt').textContent = t('water');
      document.getElementById('readingLabel').textContent = isHe ? 'מדידה *' : 'Reading *';
      document.getElementById('reading').placeholder = isHe ? 'הזן ערך מדידה' : 'Enter reading value';
      document.getElementById('monthLabel').textContent = t('month') + ' *';
      document.getElementById('cancelBtn').textContent = t('cancel');
      document.getElementById('addReadingBtn').innerHTML = `<i class="bi bi-check-lg"></i> ${t('addReading')}`;
    }

    // טעינת מדידות אנרגיה
    async function loadEnergy() {
      try {
        const response = await fetch('http://localhost:3000/api/energy/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const readings = data.readings;
        const isHe = getLang() === 'he';

        const electricity = readings.filter(r => r.type === 'electricity');
        const water = readings.filter(r => r.type === 'water');

        if (electricity.length > 0) {
          document.getElementById('lastElectricity').textContent = electricity[0].reading;
        }
        if (water.length > 0) {
          document.getElementById('lastWater').textContent = water[0].reading;
        }

        buildChart('electricityChart', electricity, isHe ? 'חשמל (קוט"ש)' : 'Electricity (kWh)', '#f59e0b');
        buildChart('waterChart', water, isHe ? 'מים (מ"ק)' : 'Water (m³)', '#06b6d4');

        const tbody = document.getElementById('energyTable');
        if (readings.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">${isHe ? 'לא נמצאו מדידות' : 'No readings found'}</td></tr>`;
          return;
        }

        tbody.innerHTML = readings.map(r => `
          <tr>
            <td>${r.id}</td>
            <td>
              <span class="badge ${r.type === 'electricity' ? 'bg-warning text-dark' : 'bg-info'}">
                ${r.type === 'electricity' ? (isHe ? 'חשמל' : 'Electricity') : (isHe ? 'מים' : 'Water')}
              </span>
            </td>
            <td>${r.reading}</td>
            <td>${r.month}</td>
            <td>${new Date(r.created_at).toLocaleDateString()}</td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error loading energy:', err);
      }
    }

    // בניית גרף
    function buildChart(canvasId, data, label, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      const sorted = data.sort((a, b) => a.month.localeCompare(b.month));
      const labels = sorted.map(r => r.month);
      const values = sorted.map(r => r.reading);

      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label,
            data: values,
            borderColor: color,
            backgroundColor: color + '20',
            tension: 0.4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    // הוספת מדידה
    async function addReading() {
      const isHe = getLang() === 'he';
      const type = document.getElementById('type').value;
      const reading = document.getElementById('reading').value;
      const month = document.getElementById('month').value;
      const modalError = document.getElementById('modalError');

      modalError.classList.add('d-none');

      if (!type || !reading || !month) {
        modalError.textContent = isHe ? 'אנא מלא את כל השדות הנדרשים.' : 'Please fill in all required fields.';
        modalError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/energy/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ type, reading, month })
        });

        const data = await response.json();
        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('addReadingModal')).hide();
          loadEnergy();
        } else {
          modalError.textContent = data.message;
          modalError.classList.remove('d-none');
        }
      } catch (err) {
        modalError.textContent = isHe ? 'שגיאת חיבור.' : 'Connection error.';
        modalError.classList.remove('d-none');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadEnergy();
    });
  </script>

</body>
</html>
