<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Announcements</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar - נטען דינמית לפי תפקיד -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="userName"></small>
    </div>
    <ul class="nav flex-column px-2" id="sidebarNav"></ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0">Announcements</h4>
        <small class="text-muted">Building announcements and updates</small>
      </div>
      <!-- כפתור הוספה למנהל בלבד -->
      <button id="addBtn" class="btn btn-primary d-none" data-bs-toggle="modal" data-bs-target="#addAnnouncementModal">
        <i class="bi bi-plus-circle"></i> Add Announcement
      </button>
    </div>

    <!-- Announcements List -->
    <div id="announcementsList" class="row g-4">
      <div class="col-12 text-center py-4 text-muted">
        Loading announcements...
      </div>
    </div>

  </div>

  <!-- Add Announcement Modal -->
  <div class="modal fade" id="addAnnouncementModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-megaphone"></i> Add Announcement
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalError" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label class="form-label fw-bold">Title *</label>
            <input type="text" id="title" class="form-control" placeholder="Announcement title">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Content *</label>
            <textarea id="content" class="form-control" rows="4" placeholder="Write your announcement..."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Expires On</label>
            <input type="date" id="expires_at" class="form-control">
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addAnnouncement()">
            <i class="bi bi-check-lg"></i> Post Announcement
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user) {
      window.location.href = 'login.html';
    }

    document.getElementById('userName').textContent = user.full_name;

    // בניית תפריט צד לפי תפקיד
    const sidebarNav = document.getElementById('sidebarNav');
    if (user.role === 'manager') {
      document.getElementById('addBtn').classList.remove('d-none');
      sidebarNav.innerHTML = `
        <li class="nav-item"><a class="nav-link" href="dashboard-manager.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="faults.html"><i class="bi bi-exclamation-triangle"></i> Faults</a></li>
        <li class="nav-item"><a class="nav-link" href="maintenance.html"><i class="bi bi-tools"></i> Maintenance</a></li>
        <li class="nav-item"><a class="nav-link" href="energy.html"><i class="bi bi-lightning"></i> Energy</a></li>
        <li class="nav-item"><a class="nav-link active" href="announcements.html"><i class="bi bi-megaphone"></i> Announcements</a></li>
        <li class="nav-item"><a class="nav-link" href="reports.html"><i class="bi bi-bar-chart"></i> Reports</a></li>
        <li class="nav-item"><a class="nav-link" href="users.html"><i class="bi bi-people"></i> Users</a></li>
        <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
      `;
    } else if (user.role === 'tenant') {
      sidebarNav.innerHTML = `
        <li class="nav-item"><a class="nav-link" href="dashboard-tenant.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="report-fault.html"><i class="bi bi-plus-circle"></i> Report Fault</a></li>
        <li class="nav-item"><a class="nav-link" href="my-faults.html"><i class="bi bi-exclamation-triangle"></i> My Faults</a></li>
        <li class="nav-item"><a class="nav-link active" href="announcements.html"><i class="bi bi-megaphone"></i> Announcements</a></li>
        <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
      `;
    } else {
      sidebarNav.innerHTML = `
        <li class="nav-item"><a class="nav-link" href="dashboard-technician.html"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="assigned-faults.html"><i class="bi bi-exclamation-triangle"></i> Assigned Faults</a></li>
        <li class="nav-item"><a class="nav-link active" href="announcements.html"><i class="bi bi-megaphone"></i> Announcements</a></li>
        <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
      `;
    }

    // טעינת המודעות מהשרת
    async function loadAnnouncements() {
      try {
        const response = await fetch('http://localhost:3000/api/announcements/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const announcements = data.announcements;
        const list = document.getElementById('announcementsList');

        if (announcements.length === 0) {
          list.innerHTML = '<div class="col-12 text-center py-4 text-muted">No announcements yet</div>';
          return;
        }

        list.innerHTML = announcements.map(a => `
          <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-header bg-primary text-white d-flex justify-content-between">
                <h6 class="mb-0 fw-bold">${a.title}</h6>
                ${user.role === 'manager' ? `
                  <button class="btn btn-sm btn-danger" onclick="deleteAnnouncement(${a.id})">
                    <i class="bi bi-trash"></i>
                  </button>
                ` : ''}
              </div>
              <div class="card-body">
                <p class="text-muted">${a.content}</p>
                <small class="text-muted">
                  <i class="bi bi-person"></i> ${a.created_by_name || 'Manager'}
                  &nbsp;|&nbsp;
                  <i class="bi bi-calendar"></i> ${new Date(a.created_at).toLocaleDateString()}
                  ${a.expires_at ? `&nbsp;|&nbsp;<i class="bi bi-clock"></i> Expires: ${new Date(a.expires_at).toLocaleDateString()}` : ''}
                </small>
              </div>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading announcements:', err);
      }
    }

    // הוספת מודעה חדשה
    async function addAnnouncement() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      const expires_at = document.getElementById('expires_at').value;
      const modalError = document.getElementById('modalError');

      modalError.classList.add('d-none');

      if (!title || !content) {
        modalError.textContent = 'Please fill in all required fields.';
        modalError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/announcements/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, content, expires_at })
        });

        const data = await response.json();

        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('addAnnouncementModal')).hide();
          loadAnnouncements();
        } else {
          modalError.textContent = data.message;
          modalError.classList.remove('d-none');
        }

      } catch (err) {
        modalError.textContent = 'Connection error. Please try again.';
        modalError.classList.remove('d-none');
      }
    }

    // מחיקת מודעה
    async function deleteAnnouncement(id) {
      if (!confirm('Are you sure you want to delete this announcement?')) return;

      try {
        const response = await fetch(`http://localhost:3000/api/announcements/delete/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        if (response.ok) {
          loadAnnouncements();
        } else {
          alert(data.message);
        }

      } catch (err) {
        alert('Error deleting announcement.');
      }
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    loadAnnouncements();
  </script>

</body>
</html>
