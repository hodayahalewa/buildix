<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - My Faults</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="userName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-tenant.html">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="report-fault.html">
          <i class="bi bi-plus-circle"></i> Report Fault
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="my-faults.html">
          <i class="bi bi-exclamation-triangle"></i> My Faults
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> Announcements
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0">My Faults</h4>
        <small class="text-muted">Track all your reported faults</small>
      </div>
      <a href="report-fault.html" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Report New Fault
      </a>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-4">
            <select id="filterStatus" class="form-select" onchange="filterFaults()">
              <option value="">All Statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In Progress</option>
              <option value="waiting_part">Waiting Part</option>
              <option value="closed">Closed</option>
            </select>
          </div>
          <div class="col-md-4">
            <select id="filterUrgency" class="form-select" onchange="filterFaults()">
              <option value="">All Urgencies</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="col-md-4">
            <button class="btn btn-outline-secondary w-100" onclick="resetFilters()">
              <i class="bi bi-arrow-counterclockwise"></i> Reset
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Faults List -->
    <div id="faultsList" class="row g-4">
      <div class="col-12 text-center py-4 text-muted">
        Loading your faults...
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר ושהוא דייר
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'tenant') {
      window.location.href = 'login.html';
    }

    document.getElementById('userName').textContent = user.full_name;

    // משתנה לשמירת כל התקלות
    let allFaults = [];

    // טעינת התקלות של הדייר
    async function loadMyFaults() {
      try {
        const response = await fetch('http://localhost:3000/api/faults/my', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        allFaults = data.faults;
        renderFaults(allFaults);

      } catch (err) {
        console.error('Error loading faults:', err);
      }
    }

    // הצגת התקלות כקלפים
    function renderFaults(faults) {
      const list = document.getElementById('faultsList');

      if (faults.length === 0) {
        list.innerHTML = `
          <div class="col-12 text-center py-5">
            <i class="bi bi-check-circle text-success fs-1"></i>
            <h5 class="mt-3 text-muted">No faults reported yet</h5>
            <a href="report-fault.html" class="btn btn-primary mt-2">
              <i class="bi bi-plus-circle"></i> Report Your First Fault
            </a>
          </div>`;
        return;
      }

      list.innerHTML = faults.map(fault => `
        <div class="col-md-6">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h6 class="fw-bold mb-0">#${fault.id} - ${fault.title}</h6>
              <span class="badge-${fault.status.replace('_', '-')}">${fault.status.replace('_', ' ')}</span>
            </div>
            <div class="card-body">
              <p class="text-muted small mb-2">${fault.description || 'No description provided'}</p>
              <div class="d-flex gap-3 small text-muted">
                <span><i class="bi bi-tag"></i> ${fault.fault_type}</span>
                <span><i class="bi bi-layers"></i> Floor ${fault.floor || 'N/A'}</span>
                <span><i class="bi bi-door-open"></i> Unit ${fault.unit_number || 'N/A'}</span>
              </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between align-items-center">
              <span class="badge-${fault.urgency}">${fault.urgency}</span>
              <small class="text-muted">
                <i class="bi bi-calendar"></i> ${new Date(fault.created_at).toLocaleDateString()}
              </small>
            </div>
          </div>
        </div>
      `).join('');
    }

    // סינון תקלות
    function filterFaults() {
      const status = document.getElementById('filterStatus').value;
      const urgency = document.getElementById('filterUrgency').value;

      const filtered = allFaults.filter(fault => {
        const matchStatus = !status || fault.status === status;
        const matchUrgency = !urgency || fault.urgency === urgency;
        return matchStatus && matchUrgency;
      });

      renderFaults(filtered);
    }

    // איפוס פילטרים
    function resetFilters() {
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterUrgency').value = '';
      renderFaults(allFaults);
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    loadMyFaults();
  </script>

</body>
</html>
