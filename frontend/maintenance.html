<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Preventive Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="managerName"></small>
    </div>
    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link" href="dashboard-manager.html">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="faults.html">
          <i class="bi bi-exclamation-triangle"></i> Faults
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="maintenance.html">
          <i class="bi bi-tools"></i> Maintenance
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="energy.html">
          <i class="bi bi-lightning"></i> Energy
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> Announcements
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="reports.html">
          <i class="bi bi-bar-chart"></i> Reports
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="users.html">
          <i class="bi bi-people"></i> Users
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0">Preventive Maintenance</h4>
        <small class="text-muted">Manage scheduled maintenance tasks</small>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addMaintenanceModal">
        <i class="bi bi-plus-circle"></i> Add Maintenance
      </button>
    </div>

    <!-- Maintenance Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Category</th>
                <th>Frequency</th>
                <th>Last Done</th>
                <th>Next Due</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="maintenanceTable">
              <tr>
                <td colspan="8" class="text-center py-4 text-muted">
                  Loading maintenance tasks...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- Add Maintenance Modal -->
  <div class="modal fade" id="addMaintenanceModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-tools"></i> Add Maintenance Task
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="modalError" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label class="form-label fw-bold">Title *</label>
            <input type="text" id="title" class="form-control" placeholder="e.g. Elevator inspection">
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Category *</label>
            <select id="category" class="form-select">
              <option value="">Select category</option>
              <option value="elevator">Elevator</option>
              <option value="pumps">Pumps</option>
              <option value="gardening">Gardening</option>
              <option value="electrical">Electrical</option>
              <option value="cleaning">Cleaning</option>
              <option value="fire_safety">Fire Safety</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Description</label>
            <textarea id="description" class="form-control" rows="3" placeholder="Describe the maintenance task..."></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Frequency *</label>
            <select id="frequency" class="form-select">
              <option value="">Select frequency</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="quarterly">Quarterly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Last Done</label>
              <input type="date" id="last_done" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-bold">Next Due *</label>
              <input type="date" id="next_due" class="form-control">
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="addMaintenance()">
            <i class="bi bi-check-lg"></i> Add Task
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר ושהוא מנהל
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    // טעינת משימות התחזוקה מהשרת
    async function loadMaintenance() {
      try {
        const response = await fetch('http://localhost:3000/api/maintenance/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const tasks = data.tasks;
        const tbody = document.getElementById('maintenanceTable');

        if (tasks.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No maintenance tasks found</td></tr>';
          return;
        }

        tbody.innerHTML = tasks.map(task => `
          <tr>
            <td>${task.id}</td>
            <td>${task.title}</td>
            <td>${task.category}</td>
            <td>${task.frequency}</td>
            <td>${task.last_done ? new Date(task.last_done).toLocaleDateString() : 'N/A'}</td>
            <td>${task.next_due ? new Date(task.next_due).toLocaleDateString() : 'N/A'}</td>
            <td>
              <span class="badge ${task.status === 'done' ? 'bg-success' : 'bg-warning text-dark'}">
                ${task.status}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-success" onclick="markDone(${task.id})">
                <i class="bi bi-check-lg"></i> Done
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error loading maintenance:', err);
      }
    }

    // הוספת משימת תחזוקה חדשה
    async function addMaintenance() {
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const frequency = document.getElementById('frequency').value;
      const last_done = document.getElementById('last_done').value;
      const next_due = document.getElementById('next_due').value;
      const modalError = document.getElementById('modalError');

      modalError.classList.add('d-none');

      if (!title || !category || !frequency || !next_due) {
        modalError.textContent = 'Please fill in all required fields.';
        modalError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/maintenance/add', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ title, category, description, frequency, last_done, next_due })
        });

        const data = await response.json();

        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('addMaintenanceModal')).hide();
          loadMaintenance();
        } else {
          modalError.textContent = data.message;
          modalError.classList.remove('d-none');
        }

      } catch (err) {
        modalError.textContent = 'Connection error. Please try again.';
        modalError.classList.remove('d-none');
      }
    }

    // סימון משימה כבוצעה
    async function markDone(taskId) {
      if (!confirm('Mark this task as done?')) return;

      try {
        const response = await fetch('http://localhost:3000/api/maintenance/done', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ task_id: taskId })
        });

        const data = await response.json();
        if (response.ok) {
          loadMaintenance();
        } else {
          alert(data.message);
        }

      } catch (err) {
        alert('Error. Please try again.');
      }
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    loadMaintenance();
  </script>

</body>
</html>
