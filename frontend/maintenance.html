  <script>
    // בדיקה שהמשתמש מחובר ושהוא מנהל
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'manager') {
      window.location.href = 'login.html';
    }

    document.getElementById('managerName').textContent = user.full_name;

    // משתנה גלובלי לשמירת כל המשימות
    let allTasks = [];

    // תרגום קטגוריה לשפה הנוכחית
    function translateCategory(cat, isHe) {
      const map = {
        elevator: isHe ? 'מעלית' : 'Elevator',
        pumps: isHe ? 'משאבות' : 'Pumps',
        gardening: isHe ? 'גינון' : 'Gardening',
        electrical: isHe ? 'חשמל' : 'Electrical',
        cleaning: isHe ? 'ניקיון' : 'Cleaning',
        fire_safety: isHe ? 'בטיחות אש' : 'Fire Safety',
        other: isHe ? 'אחר' : 'Other'
      };
      return map[cat] || cat;
    }

    // תרגום תדירות לשפה הנוכחית
    function translateFrequency(freq, isHe) {
      const map = {
        weekly: isHe ? 'שבועי' : 'Weekly',
        monthly: isHe ? 'חודשי' : 'Monthly',
        quarterly: isHe ? 'רבעוני' : 'Quarterly',
        yearly: isHe ? 'שנתי' : 'Yearly'
      };
      return map[freq] || freq;
    }

    // תרגום סוג בדיקה לשפה הנוכחית
    function translateVerification(type, isHe) {
      const map = {
        manual: isHe ? 'ידני' : 'Manual',
        energy_electricity: isHe ? 'מדידת חשמל' : 'Electricity Reading',
        energy_water: isHe ? 'מדידת מים' : 'Water Reading'
      };
      return map[type] || type;
    }

    // בדיקת קרבה לתאריך ביצוע וצביעה בהתאם
    function getDueBadge(nextDue, isHe) {
      if (!nextDue) return '';
      const today = new Date();
      today.setHours(0,0,0,0);
      const due = new Date(nextDue);
      const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
      if (diff < 0) return `<span class="badge bg-danger ms-1">${isHe ? 'באיחור' : 'Overdue'}</span>`;
      if (diff === 0) return `<span class="badge bg-warning text-dark ms-1">${isHe ? 'היום!' : 'Today!'}</span>`;
      if (diff <= 7) return `<span class="badge bg-info ms-1">${isHe ? `בעוד ${diff} ימים` : `In ${diff} days`}</span>`;
      return '';
    }

      document.getElementById('addBtn').innerHTML = `<i class="bi bi-plus-circle"></i> ${t('addMaintenance')}`;
      document.getElementById('searchLabel').textContent = isHe ? 'חיפוש' : 'Search';
      document.getElementById('searchInput').placeholder = isHe ? 'חפש משימה...' : 'Search task...';
      document.getElementById('filterCategoryLabel').textContent = t('category');

      document.getElementById('editVerificationLabel').textContent = isHe ? 'סוג בדיקה *' : 'Verification Type *';
      document.getElementById('editVerManual').textContent = isHe ? 'ידני (אישור בלבד)' : 'Manual (confirm only)';
      document.getElementById('editVerElectricity').textContent = isHe ? 'מדידת חשמל חודשית' : 'Monthly electricity reading';
      document.getElementById('editVerWater').textContent = isHe ? 'מדידת מים חודשית' : 'Monthly water reading';
      document.getElementById('editLastDoneLabel').textContent = t('lastDone');
      document.getElementById('editNextDueLabel').textContent = t('nextDue') + ' *';
      document.getElementById('editCancelBtn').textContent = t('cancel');
      document.getElementById('editSaveBtn').innerHTML = `<i class="bi bi-check-lg"></i> ${isHe ? 'שמור שינויים' : 'Save Changes'}`;
      document.getElementById('editElevatorOpt').textContent = isHe ? 'מעלית' : 'Elevator';
      document.getElementById('editPumpsOpt').textContent = isHe ? 'משאבות' : 'Pumps';
      document.getElementById('editGardeningOpt').textContent = isHe ? 'גינון' : 'Gardening';
      document.getElementById('editElectricalOpt').textContent = isHe ? 'חשמל' : 'Electrical';
      document.getElementById('editCleaningOpt').textContent = isHe ? 'ניקיון' : 'Cleaning';
      document.getElementById('editFireOpt').textContent = isHe ? 'בטיחות אש' : 'Fire Safety';
      document.getElementById('editOtherOpt').textContent = isHe ? 'אחר' : 'Other';
      document.getElementById('editWeeklyOpt').textContent = isHe ? 'שבועי' : 'Weekly';
      document.getElementById('editMonthlyOpt').textContent = isHe ? 'חודשי' : 'Monthly';
      document.getElementById('editQuarterlyOpt').textContent = isHe ? 'רבעוני' : 'Quarterly';
      document.getElementById('editYearlyOpt').textContent = isHe ? 'שנתי' : 'Yearly';
    }

    // טעינת משימות תחזוקה מהשרת
    async function loadMaintenance() {
      try {
        const response = await fetch('http://localhost:3000/api/maintenance/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();
        allTasks = data.tasks;
        renderTasks(allTasks);
      } catch (err) {
        console.error('Error loading maintenance:', err);
      }
    }

    // הצגת משימות בטבלה עם תרגום וצביעה לפי תאריך
    function renderTasks(tasks) {
      const isHe = getLang() === 'he';
      const tbody = document.getElementById('maintenanceTable');
      if (tasks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center py-4 text-muted">${isHe ? 'לא נמצאו משימות' : 'No tasks found'}</td></tr>`;
        return;
      }
      tbody.innerHTML = tasks.map(task => `
        <tr>
          <td>${task.id}</td>
          <td>${task.title}</td>
          <td>${translateCategory(task.category, isHe)}</td>
          <td>${translateFrequency(task.frequency, isHe)}</td>
          <td><span class="badge bg-secondary">${translateVerification(task.verification_type || 'manual', isHe)}</span></td>
          <td>${task.last_done ? new Date(task.last_done).toLocaleDateString() : (isHe ? 'טרם בוצע' : 'Never')}</td>
          <td>
            ${task.next_due ? new Date(task.next_due).toLocaleDateString() : 'N/A'}
            ${getDueBadge(task.next_due, isHe)}
          </td>
          <td>
            <span class="badge ${task.status === 'done' ? 'bg-success' : 'bg-warning text-dark'}">
              ${task.status === 'done' ? (isHe ? 'בוצע' : 'Done') : (isHe ? 'ממתין' : 'Pending')}
            </span>
          </td>
          <td class="d-flex gap-1">
            <button class="btn btn-sm btn-success" onclick="markDone(${task.id})" title="${isHe ? 'סמן כבוצע' : 'Mark as done'}">
              <i class="bi bi-check-lg"></i>
            </button>
            <button class="btn btn-sm btn-warning" onclick="openEditModal(${task.id})" title="${isHe ? 'ערוך' : 'Edit'}">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-danger" onclick="deleteTask(${task.id})" title="${isHe ? 'מחק' : 'Delete'}">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    // סינון משימות לפי כל הפילטרים
    function filterTasks() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('filterCategory').value;
      const status = document.getElementById('filterStatus').value;
      const freq = document.getElementById('filterFreq').value;
      const due = document.getElementById('filterDue').value;
      const today = new Date();
      today.setHours(0,0,0,0);

      const filtered = allTasks.filter(task => {
        const matchSearch = !search || task.title.toLowerCase().includes(search);
        const matchCategory = !category || task.category === category;
        const matchStatus = !status || task.status === status;
        const matchFreq = !freq || task.frequency === freq;
        let matchDue = true;
        if (due && task.next_due) {
          const dueDate = new Date(task.next_due);
          dueDate.setHours(0,0,0,0);
          const diff = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
          if (due === 'today') matchDue = diff === 0;
          else if (due === 'week') matchDue = diff >= 0 && diff <= 7;
          else if (due === 'overdue') matchDue = diff < 0;
        }
        return matchSearch && matchCategory && matchStatus && matchFreq && matchDue;
      });
      renderTasks(filtered);
    }

    // איפוס פילטרים
    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterStatus').value = '';
      document.getElementById('filterFreq').value = '';
      document.getElementById('filterDue').value = '';
      renderTasks(allTasks);
    }

    // הוספת משימת תחזוקה חדשה
    async function addMaintenance() {
      const isHe = getLang() === 'he';
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const description = document.getElementById('description').value;
      const frequency = document.getElementById('frequency').value;
      const verification_type = document.getElementById('verification_type').value;
      const last_done = document.getElementById('last_done').value;
      const next_due = document.getElementById('next_due').value;
      const modalError = document.getElementById('modalError');

      modalError.classList.add('d-none');
      if (!title || !category || !frequency || !next_due) {
        modalError.textContent = isHe ? 'אנא מלא את כל השדות הנדרשים.' : 'Please fill in all required fields.';
        modalError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/maintenance/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ title, category, description, frequency, verification_type, last_done, next_due })
        });
        const data = await response.json();
        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('addMaintenanceModal')).hide();
          loadMaintenance();
          refreshAlerts();
        } else {
          modalError.textContent = data.message;
          modalError.classList.remove('d-none');
        }
      } catch (err) {
        modalError.textContent = isHe ? 'שגיאת חיבור.' : 'Connection error.';
        modalError.classList.remove('d-none');
      }
    }

    // פתיחת מודל עריכה עם נתונים קיימים
    function openEditModal(taskId) {
      const task = allTasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById('editTaskId').value = task.id;
      document.getElementById('editTitle').value = task.title;
      document.getElementById('editCategory').value = task.category;
      document.getElementById('editDescription').value = task.description || '';
      document.getElementById('editFrequency').value = task.frequency;
      document.getElementById('editVerification_type').value = task.verification_type || 'manual';
      document.getElementById('editLastDone').value = task.last_done ? task.last_done.split('T')[0] : '';
      document.getElementById('editNextDue').value = task.next_due ? task.next_due.split('T')[0] : '';
      document.getElementById('editModalError').classList.add('d-none');
      new bootstrap.Modal(document.getElementById('editMaintenanceModal')).show();
    }

    // שמירת עריכת משימה
    async function saveEdit() {
      const isHe = getLang() === 'he';
      const id = document.getElementById('editTaskId').value;
      const title = document.getElementById('editTitle').value;
      const category = document.getElementById('editCategory').value;
      const description = document.getElementById('editDescription').value;
      const frequency = document.getElementById('editFrequency').value;
      const verification_type = document.getElementById('editVerification_type').value;
      const last_done = document.getElementById('editLastDone').value;
      const next_due = document.getElementById('editNextDue').value;
      const editModalError = document.getElementById('editModalError');

      editModalError.classList.add('d-none');
      if (!title || !category || !frequency || !next_due) {
        editModalError.textContent = isHe ? 'אנא מלא את כל השדות הנדרשים.' : 'Please fill in all required fields.';
        editModalError.classList.remove('d-none');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/maintenance/update', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ id, title, category, description, frequency, verification_type, last_done, next_due })
        });
        const data = await response.json();
        if (response.ok) {
          bootstrap.Modal.getInstance(document.getElementById('editMaintenanceModal')).hide();
          loadMaintenance();
        } else {
          editModalError.textContent = data.message;
          editModalError.classList.remove('d-none');
        }
      } catch (err) {
        editModalError.textContent = isHe ? 'שגיאת חיבור.' : 'Connection error.';
        editModalError.classList.remove('d-none');
      }
    }

    // סימון משימה כבוצעה - בודק אימות לפי סוג המשימה
    async function markDone(taskId) {
      const isHe = getLang() === 'he';
      if (!confirm(isHe ? '⚠️ האם אתה מאשר שהמשימה בוצעה?' : '⚠️ Confirm task completion?')) return;

      try {
        const response = await fetch('http://localhost:3000/api/maintenance/done', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ task_id: taskId })
        });
        const data = await response.json();
        if (response.ok) {
          loadMaintenance();
          refreshAlerts();
        } else {
          alert(isHe ? `❌ ${data.message}` : `❌ ${data.message}`);
          if (data.redirect) window.location.href = data.redirect;
        }
      } catch (err) {
        alert(isHe ? 'שגיאה.' : 'Error.');
      }
    }

    // מחיקת משימת תחזוקה
    async function deleteTask(taskId) {
      const isHe = getLang() === 'he';
      if (!confirm(isHe ? '⚠️ האם אתה בטוח שברצונך למחוק משימה זו?' : '⚠️ Are you sure you want to delete this task?')) return;

      try {
        const response = await fetch(`http://localhost:3000/api/maintenance/delete/${taskId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (response.ok) {
          loadMaintenance();
          refreshAlerts();
        } else {
          const data = await response.json();
          alert(isHe ? `שגיאה: ${data.message}` : `Error: ${data.message}`);
        }
      } catch (err) {
        alert(isHe ? 'שגיאה.' : 'Error.');
      }
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // טעינת הדף
    document.addEventListener('DOMContentLoaded', () => {
      applyTranslations();
      loadMaintenance();
    });
  </script>
</body>
