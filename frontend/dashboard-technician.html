<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUILDIX - Technician Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="text-center py-4">
      <h5 class="text-white fw-bold">
        <i class="bi bi-building"></i> BUILDIX
      </h5>
      <small class="text-secondary" id="techName"></small>
    </div>

    <ul class="nav flex-column px-2">
      <li class="nav-item">
        <a class="nav-link active" href="dashboard-technician.html">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="assigned-faults.html">
          <i class="bi bi-exclamation-triangle"></i> Assigned Faults
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="announcements.html">
          <i class="bi bi-megaphone"></i> Announcements
        </a>
      </li>
      <li class="nav-item mt-4">
        <a class="nav-link text-danger" href="#" onclick="logout()">
          <i class="bi bi-box-arrow-left"></i> Logout
        </a>
      </li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-0">Technician Dashboard</h4>
        <small class="text-muted">Welcome back, <span id="welcomeName"></span></small>
      </div>
      <div>
        <span class="badge bg-warning text-dark">Technician</span>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="card stat-card bg-primary text-white">
          <div class="stat-number" id="totalAssigned">0</div>
          <div class="stat-label text-white-50">Total Assigned</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card bg-warning text-white">
          <div class="stat-number" id="inProgress">0</div>
          <div class="stat-label text-white-50">In Progress</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card bg-success text-white">
          <div class="stat-number" id="completed">0</div>
          <div class="stat-label text-white-50">Completed</div>
        </div>
      </div>
    </div>

    <!-- Assigned Faults Table -->
    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h6 class="fw-bold mb-0">
          <i class="bi bi-tools text-warning"></i> My Assigned Faults
        </h6>
        <a href="assigned-faults.html" class="btn btn-sm btn-primary">View All</a>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Floor</th>
                <th>Unit</th>
                <th>Urgency</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="faultsTable">
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">
                  Loading assigned faults...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // בדיקה שהמשתמש מחובר ושהוא טכנאי
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (!token || !user || user.role !== 'technician') {
      window.location.href = 'login.html';
    }

    // הצגת שם הטכנאי
    document.getElementById('techName').textContent = user.full_name;
    document.getElementById('welcomeName').textContent = user.full_name;

    // טעינת התקלות המוקצות לטכנאי
    async function loadAssignedFaults() {
      try {
        const response = await fetch('http://localhost:3000/api/faults/assigned', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        const faults = data.faults;

        // חישוב סטטיסטיקות
        document.getElementById('totalAssigned').textContent = faults.length;
        document.getElementById('inProgress').textContent = faults.filter(f => f.status === 'in_progress').length;
        document.getElementById('completed').textContent = faults.filter(f => f.status === 'closed').length;

        // הצגת התקלות בטבלה
        const tbody = document.getElementById('faultsTable');
        if (faults.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No faults assigned yet</td></tr>';
          return;
        }

        tbody.innerHTML = faults.slice(0, 5).map(fault => `
          <tr>
            <td>${fault.id}</td>
            <td>${fault.title}</td>
            <td>${fault.floor || 'N/A'}</td>
            <td>${fault.unit_number || 'N/A'}</td>
            <td><span class="badge-${fault.urgency}">${fault.urgency}</span></td>
            <td><span class="badge-${fault.status.replace('_', '-')}">${fault.status.replace('_', ' ')}</span></td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="updateStatus(${fault.id})">
                <i class="bi bi-pencil"></i> Update
              </button>
            </td>
          </tr>
        `).join('');

      } catch (err) {
        console.error('Error loading faults:', err);
      }
    }

    // עדכון סטטוס תקלה על ידי הטכנאי
    async function updateStatus(faultId) {
      const status = prompt('Enter new status:\n- in_progress\n- waiting_part\n- closed');
      if (!status) return;

      const note = prompt('Add a note (optional):');

      try {
        const response = await fetch('http://localhost:3000/api/faults/status', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ fault_id: faultId, status, note })
        });

        const data = await response.json();
        if (response.ok) {
          alert('Status updated successfully!');
          loadAssignedFaults();
        } else {
          alert(data.message);
        }
      } catch (err) {
        alert('Error updating status. Please try again.');
      }
    }

    // פונקציית התנתקות
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'login.html';
    }

    // טעינת הנתונים בעת פתיחת הדף
    loadAssignedFaults();
  </script>

</body>
</html>
